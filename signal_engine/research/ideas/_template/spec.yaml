# Strategy specification, schema v2. Copy next to idea.md and complete EVERY required field.
# This file holds strategy INTENT only. Broker and product rules live in a deployment profile
# (research/profiles/), and execution settings (slippage, costs, warm-up, bar size) are
# resolved by the platform. Override those only in execution.yaml, with a reason.
#
# A spec that is incomplete or vague is rejected before any backtest runs
# (research/intake/spec.py). Write rules a program could code without guessing:
#   not "buy when momentum is strong"
#   but "5-min close > VWAP; EMA9 > EMA20; enter at the next candle open"
# Keep it to the strategy as it is today. Experiments, rejected variants and observations
# belong in idea.md and the run records, not here.
#
# Fields marked (optional) may be left out. Anything you leave out that the platform can infer
# is recorded as an assumption for you to confirm. Replace every placeholder below.

schema_version: 2
name: Short strategy name

source:                       # saved unchanged in ideas/_inbox/
  kind: own_words             # video | article | pdf | screenshot | own_words
  ref: _inbox/your-file.txt

profile: flattrade-nse-cash   # deployment profile name (research/profiles/<name>.yaml)

style: intraday | swing | positional   # pick one
direction: long_only | short_only | both   # pick one; swing and positional must be long_only
timeframe: 5m                 # one of: 1m, 5m, 15m, 1h, 1d
product: MIS                  # (optional) MIS for intraday, CNC for swing or positional

entry:
  - Condition with a number or threshold
  - Which bar the order fills on, e.g. next candle open
exit:
  - Condition with a number or threshold
stop:                         # a rule with a number, or the single word: none
  - e.g. 1 ATR(14) below entry
take_profit:                  # a rule, or the single word: none
  - e.g. 2R target
holding_period: 12 bars       # or: same_session

indicators:                   # or the single word: none
  - {name: VWAP, anchor: session}       # VWAP needs an anchor
  - {name: EMA, period: 9, source: close}   # source defaults to close for price indicators
parameters:                   # every tunable value with the value used, or: none
  ema_fast: 9

# (optional) Signal, order and fill timing. Leave it out and the platform infers it from the
# entry text, records the inference and asks you to confirm it if it matters.
# timing:
#   signal_evaluation: bar_close    # bar_close | bar_open | intrabar | tick
#   order_submission: signal_close  # signal_close | next_bar_open
#   fill_model: next_bar_open       # next_bar_open | signal_close | limit_at_level

# (optional) What price stops, targets and sizing are measured from, only where ambiguous.
# reference_prices: {stop: entry_fill}

# (optional) Reference cost lines. The primary cost is the deployment profile broker's
# statutory model; each level below adds a flat round-trip comparison line to the run record.
# Report-only: these never drive the verdict or a gate. Each level is above 0 and at most 1000.
# costs:
#   reference_round_trip_bps: [32]

# (optional) Explicit universe declaration. Each key takes the one value shown for its type
# (the types are listed in research/intake/fields.py UNIVERSE_DECLARATIONS).
# universe:
#   type: current_fno
#   exchange: NSE
#   membership_basis: current
#   point_in_time: false
#   survivorship_bias: true

# (optional, intraday only) Data contract. All four keys are required when the block is present.
# frequency must equal timeframe. min_n_minutes is an integer from 1 to the bar length.
# data:
#   frequency: 5m
#   field_families: [price, volume]
#   min_n_minutes: 1
#   complete_bins: {first: "09:15", last: "15:10"}   # both on the bar grid that starts at 09:15

# (optional) What a decision may read: a list of plain statements, one per line.
# information_boundary:
#   - A decision at the close of bar k reads only bars with open time <= k

filters: none                 # symbol or market filters, or the single word: none
session_window: {entry: "09:20-14:30"}   # IST range, or the single word: none

re_entry:
  allowed: false              # if true, also: max_per_symbol_day: 1 and (optional) trigger

sizing:
  risk_per_trade_pct: 1.0     # percent of capital risked per trade
  capital_per_trade: 100000   # rupees deployed per trade (a different number from risk)
  # A strategy with stop: none must also declare basis: fixed_notional. Without it the run is
  # refused before execution, because a trade with no stop cannot be sized by risk.
  # basis: fixed_notional

portfolio:
  mode: single_position       # single_position | multi_position
  scope: per_symbol           # single_position only: global (one position in total) | per_symbol
  # multi_position needs: max_concurrent, max_trades_per_day, capital_per_position,
  #   max_exposure, selection, conflict. It takes no scope.

# (optional) Order types, only if the source says. Default is market entry, stop-market stop.
# order_types: {entry: market, stop: stop_market, target: limit}

disclosure:                   # (optional) never blocks a run, but under-reporting inflates results
  prior_variants: 0           # variants already tried before this one
  chart_peeking: false        # true if something you saw on the chart shaped the rules
  destination: python         # python | pine_tradingview

# rationale: One or two sentences on why this should have an edge.   (optional)
# kill_criterion: The result that would make you drop it.            (optional)
