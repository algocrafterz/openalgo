- id: A-009
  field: entry
  section: intent
  value:
  - Bars are 5m, open-time stamped, IST; a bar is completed at its open time plus
    5 minutes
  - Intraday return of symbol s on session d is r(s,d) = Close of the 14:45 bar /
    Open of the 09:20 bar - 1, both bars from session d; both prices carry the same
    price factor, so back-adjustment does not change r
  - A session d before the decision session counts as a valid prior session for s
    only when (1) the s-d session passes the data contract, (2) d is not an ex-date
    of a split, bonus or other corporate action that changes the price factor of s,
    and (3) s was eligible on d under the platform eligibility rules (listing age,
    traded, session volume above 1, NSE raw close at or above Rs 10); an invalid session
    contributes no observation and does not break the window (IDEA-029 decision 11
    precedent). PROPOSED - owner decision D6
  - m60(s,D) is the arithmetic mean of r over the 60 most recent valid prior sessions
    of s strictly before session D; sd60(s,D) is the sample standard deviation (ddof
    1) of the same 60 values; sessions are counted as official NSE trading sessions
    with a valid observation, never as calendar days
  - Selection time - the ranking for session D is fixed from data up to and including
    the close of the 14:45 bar of the previous official session (14:50 IST on D-1);
    no bar of session D is read by the ranking, and the ranking is not revised during
    session D
  - Pre-selection eligibility for session D uses only facts known before 09:15 IST
    on D - (1) s has at least 60 valid prior sessions, (2) D is not an ex-date of
    a split, bonus or other price-factor corporate action for s (ex-dates are announced
    before the session), (3) the NSE raw close of the last valid prior session of
    s is at or above Rs 10. A symbol with fewer than 60 valid prior sessions is not
    ranked. PROPOSED - owner decision D10
  - Rank the eligible symbols by m60 from lowest to highest; an exact tie in m60 is
    broken by symbol name in ascending A to Z order; select the first 10. When fewer
    than 10 symbols are eligible, select all of them; no other symbol is substituted
    and unused capital is not reallocated. PROPOSED - owner decisions D9 and D11
  - Execution-time exclusion - a selected symbol whose session D fails the data contract,
    or fails the platform same-day eligibility rules on D (NO_TRADE, ZERO_VOLUME,
    PRICE_FLOOR on the session close), is not traded; its slot stays empty, the 11th-ranked
    symbol is not substituted, and the exclusion is counted by reason and by year.
    PROPOSED - owner decision D10
  - Entry is a market short of each traded selected symbol at the open of the 09:20
    bar of session D; in the engine the signal is taken at the close of the 09:15
    bar and filled at the next bar open; the 09:20 open is the only fill time and
    a selected symbol that is not filled then is not entered later. PROPOSED - owner
    decision D3
  - Execution constraint, not a strategy filter - a selected symbol whose stop distance
    is below 0.5% of the stop reference price is not traded, because the live validator
    rejects it (risk.min_sl_pct 0.5%, IDEA-029 decision 5 precedent); the run counts
    these as STOP_TOO_TIGHT and the slot stays empty
  - The cross-sectional dispersion of m60 changes nothing - there is no dispersion
    threshold and no filter on it; the dispersion is reported as a diagnostic only
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-010
  field: exit
  section: intent
  value:
  - Standing time exit at 14:45 from the deployment profile - an open position is
    bought back at the close of the 14:45 bar (14:50 IST), the same price that ends
    r, before the 15:00 MIS force-flat; no position is held overnight
  - Stop exit as defined in stop - when a bar's high reaches the stop the position
    closes at the stop; when a bar opens at or above the stop it closes at that open
    (gap through stop)
  - There is no other exit, no target and no trailing stop
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-011
  field: stop
  section: intent
  value:
