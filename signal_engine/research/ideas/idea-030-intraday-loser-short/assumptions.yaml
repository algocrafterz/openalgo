- id: A-030
  field: information_boundary
  section: intent
  value:
  - The ranking for session D reads only bars of sessions before D, up to and including
    the 14:45 bar of the previous official session; no bar of session D is read by
    the ranking
  - m60 and sd60 for session D use only valid prior sessions strictly before D
  - Pre-selection eligibility for D reads only the prior-session history, the corporate-action
    ex-date calendar (announced before the session) and the NSE raw close of the last
    valid prior session
  - Session D's data-contract result and its same-day platform eligibility (which
    read session D's bars, volume and close) may remove a selected symbol after ranking,
    but never add or substitute one
  - The stop reference price (the close of the 09:15 bar of D) is known before the
    09:20 fill and is used only for the stop level, never for selection
  - A position's exit reads only the bar being evaluated (its open, high and close)
    and the fixed stop
  source: user
