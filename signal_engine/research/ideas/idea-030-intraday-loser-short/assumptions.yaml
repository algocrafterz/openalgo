    never trailed; P_ref is the close of the 09:15 bar of session D (the engine's
    signal price; the 09:20 open fill is the alternative). PROPOSED - owner decisions
    D1 (multiple 1.5) and D2 (P_ref)
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
