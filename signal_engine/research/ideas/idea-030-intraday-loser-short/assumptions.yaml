- id: A-044
  field: rationale
  section: intent
  value: Tug-of-war clientele (Lou, Polk, Skouras 2019; Heston, Korajczyk, Sadka 2010)
    - attention and retail buying at or before the open, long-biased MIS books unwound
    through the day, institutions on the other side. If that clientele is persistent
    per stock, stocks with the worst recent open-to-afternoon returns keep losing
    intraday. The test separates three hypotheses - H1 persistent intraday losers
    continue to lose, H0-drift the result is only the unconditional NSE intraday short
    drift, H-sel loser selection adds value beyond that drift - by comparing the basket
    with baseline_cross_sectional (same-session random eligible-stock shorts with
    the same rules and costs; pending implementation). 60 sessions and 10 stocks are
    implementation choices, not optimised values; one frozen specification, one baseline
    run, no sweeps.
  source: user
  confidence: high
  materiality: low
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-045
  field: kill_criterion
  section: intent
  value: Any one of - (1) cross-sectional same-session excess over baseline_cross_sectional
    (pending implementation) is at or below 0 bps per trade, or its day-clustered
    t is below 2.0; (2) net fails G1.2 (+0.05R per trade) or the day-clustered net
    t is below 2.5; (3) net at or below 0 with slippage doubled (G1.3); (4) out-of-sample
    net (from 2023-11-01) at or below 0, or below 40% of in-sample; (5) net positive
    in fewer than 6 of the 10 calendar years 2017 to 2026, or the worst year below
    -0.25R; (6) the top 10 symbols carry more than 40% of net profit, or fewer than
    50% of traded symbols are net positive. A pass of (2) to (6) with a fail of (1)
    is recorded as drift harvesting, selection adds nothing, not an edge.
  source: user
  confidence: high
  materiality: low
  reason: stated in spec.yaml
  user_confirmed: true
