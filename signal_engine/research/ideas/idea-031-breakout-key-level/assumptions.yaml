- id: A-040
  field: rationale
  section: intent
  value: Price tends to break from previous-session value, previous-day and first-hour
    levels, return to test the broken level, and continue when volume and day type
    support it. The retest of a broken level is the entry, with a structural stop
    beyond the level and a target at the next registered level.
  source: user
  confidence: high
  materiality: low
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-041
  field: kill_criterion
  section: intent
  value: Any one of - net expectancy on the economic view below +0.05R per trade at
    the primary broker cost (G1.2); net at or below 0 with slippage doubled (G1.3);
    out-of-sample net at or below 0; net positive in fewer than 6 of the 10 calendar
    years; the first v1.0 run has gross expectancy at or below 0 (the 2026-09-30 shared-core
    baseline had gross about 0 and net -0.48R, so a v1.0 run without a material gross
    improvement is NO_EDGE).
  source: user
  confidence: high
  materiality: low
  reason: stated in spec.yaml
  user_confirmed: true
