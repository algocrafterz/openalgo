- id: A-009
  field: entry
  section: intent
  value:
  - Bars are 5m, open-time stamped, IST, from broker data. The signal is evaluated
    at the close of a bar and the order fills at the open of the next bar
  - Key levels are the previous-session value area high (PVAH) and low (PVAL), the
    previous-day high (PDH) and low (PDL), and the first-hour initial-balance high
    (IBH) and low (IBL, bars opening 09:15 to 10:15, valid after 10:15); value areas
    use 70 percent of the previous session volume profile built from 1-minute bars
    before 15:15
  - A break is a closed bar whose close crosses a level (close above and previous
    close at or below for highs, mirrored for lows); a retest is a break within the
    last 6 bars of the same session including the current bar, with the bar low at
    or below the level plus 0.25 x ATR(14), the close beyond the level, and a candle
    location value of at least 0.50 (long) or at most 0.50 (short)
  - Setup resolution order VAH-RT, VAL-RT, PDH-RT, PDL-RT, IBH-RT, IBL-RT, VAL-REJ,
    VAH-REJ, PDH-BRK, PDL-BRK, IBH-BRK, IBL-BRK; value-area acceptance setups are
    off; the first setup that holds sets the direction and the level
  - All break stamps are cleared at the first bar of each IST session, so a break
    in one session never gives a retest in the next
  - Score at least 7 from setup type, retest, relative volume, EMA9 slope, VWAP side
    and higher-timeframe close (15 minute close, anchored 09:15); RVOL minimum 1.2
    against a 14-session same-slot baseline
  - Gates - headroom of at least 1.5R to the ADR(14) projection, target distance at
    most 2.0R, chase distance from the level at most 1.0 ATR, session volume at least
    0.8 of the slot baseline; a missing value passes
  - Day-type counter-bias veto - a setup against the day type is vetoed (trend-extension
    100 percent and two-sided 15 percent of the initial-balance range)
  - Entry window - the signal bar opens in [09:45, 11:45); no afternoon window
  - Cooldown - more than 3 bars since the previous candidate that passed all entry
    conditions on the symbol
  - Shared trade policy - one open position per symbol, no pyramiding, no simultaneous
    long and short, re-entry in a direction only after flat, at most 2 accepted entries
    per symbol per direction per day, risk limits applied per strategy book
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-010
  field: exit
  section: intent
  value:
  - Stop exit and TP1 as defined under stop and take_profit; plan tp1_only, the whole
    position exits at TP1 or the stop, no stop move
  - A bar that opens beyond the stop exits at that open (SL_GAP); a bar whose range
    reaches the stop exits at the stop; the stop is checked before the target on the
    same bar
  - TP1 touched by a bar's range exits at the close of that bar (only if the stop
    did not trigger on that bar)
  - Time exit at the 14:45 bar open (bars 14:40 and earlier managed normally; the
    14:45 bar is not evaluated for stop or target); if no bar at or after 14:45 exists
    before 15:00 the close is flagged DATA_GAP and is not a normal time-exit observation
  - Adverse-fill close - when the entry fill is worse than the signal price by more
    than 0.5R, or past the target, the position is closed at the fill-bar open with
    zero gross R and its real cost; the entry still counts as used
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-011
  field: stop
  section: intent
  value:
  - Stop = min(level - 0.35 x ATR, signal_close - max(0.5 x ATR, 0.003 x signal_close))
    for long, mirrored for short; R is the distance from the signal close to the stop;
    the stop is fixed at the signal and never re-derived from the fill
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-012
  field: take_profit
  section: intent
  value:
  - TP1 = signal close plus direction x max(distance to the nearest registry level
    beyond the signal close padded 0.15 x ATR short of it, R), or 1.5R if no level;
    TP2 and TP3 are logged and not traded
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
