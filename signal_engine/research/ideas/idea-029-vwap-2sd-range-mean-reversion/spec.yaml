schema_version: 2
name: VWAP 2SD range mean reversion

source:
  kind: own_words
  ref: _inbox/vwap-2sd-range-mean-reversion.txt

profile: flattrade-nse-cash

style: intraday
direction: both
timeframe: 5m
product: MIS

universe:
  type: current_fno
  exchange: NSE
  membership_basis: current
  point_in_time: false
  survivorship_bias: true

# Data contract. A symbol-session that fails it is not traded and contributes no observation to
# any indicator; nothing is filled, repaired or interpolated. min_n_minutes 1 is an availability
# threshold only: it does not say a 5m bar built from fewer minutes is as reliable as a full one.
# n_minutes is kept on every bar so sensitivity at 2, 3 and 5 can be measured later.
data:
  frequency: 5m
  field_families: [price, volume]
  min_n_minutes: 1
  complete_bins: {first: "09:15", last: "15:10"}

entry:
  - Bars are 5m, open-time stamped, IST; a bar is completed at its open time plus 5 minutes and every rule below reads completed bars only
  - Session VWAP and SD reset each session and accumulate from the 09:15 bar; typical price tp = (High + Low + Close) / 3; VWAP = sum(volume x tp) / sum(volume); SD = sqrt(max(sum(volume x tp^2) / sum(volume) - VWAP^2, 0)); bands are VWAP +/- 2.0 x SD; every value is as of the close of the bar it belongs to, including that bar
  - EMA9 of close and Wilder ATR14 on 5m bars run continuously across eligible sessions; an excluded session contributes no observation and does not reset them
  - The 15m series is built from the 5m bars of each eligible session in fixed blocks of three starting at 09:15 (09:15, 09:30, ..., 15:00), so a session has 24 15m bars; a 15m bar is completed at its open time plus 15 minutes; ADX14, EMA20 and Wilder ATR14 on 15m run continuously across eligible sessions with no reset
  - Regime is valid when, on the latest completed 15m bar whose close is at or before the decision bar's close, ADX14 <= 22 and abs(EMA20[t] - EMA20[t-4]) <= 0.25 x ATR14_15m[t], where t-4 is four completed 15m bars earlier
  - Warm-up - a symbol generates no signal until at least 100 completed 15m bars from eligible sessions exist for it, counted from its first eligible observation in the dataset
  - Long arming - a completed 5m bar e arms a long setup when Low[e] <= lower band[e] and (VWAP[e] - Low[e]) / ATR14_5m[e] >= 0.75; the extreme is Low[e]
  - While armed, each later completed bar k is evaluated in this order - (1) if Low[k] < extreme, bar k replaces the setup when it passes the same band and 0.75 ATR displacement test (the extreme becomes Low[k], the arm window restarts from k), else the setup is cancelled; (2) if High[k] >= VWAP[k] the setup is cancelled; (3) if Close[k] > EMA9[k] and Close[k] > lower band[k], bar k is a would-be confirmation; it confirms when the symbol is warmed up and the regime is valid at k, else the setup is cancelled and not carried to a later bar
  - A setup stays armed for at most 6 completed bars after the extreme bar (arm_bars 6) and is cancelled at the entry cutoff; the extreme bar itself cannot confirm
  - Entry is a market order at the open of the bar after the confirmation bar; the trade is skipped, not entered and exited, when that open is at or above the target or at or below the stop for a long
  - Short is the mirror image - High[e] >= upper band[e] and (High[e] - VWAP[e]) / ATR14_5m[e] >= 0.75, a higher high replaces or cancels the setup, Low[k] <= VWAP[k] cancels it, confirmation is Close[k] < EMA9[k] and Close[k] < upper band[k] with a valid regime
  - Execution constraint, not a strategy filter - a confirmation whose stop is closer than 0.5% of the confirmation bar's close is not traded, because the live validator rejects it (risk.min_sl_pct, no per-strategy override); the run counts these as STOP_TOO_TIGHT
  - The first possible confirmation bar is the 09:15 bar, completed at 09:20, so the first entry fill is at the 09:20 open; the last entry fill is at the 14:15 open
  - A confirmation consumes only the setup that confirmed, also when the 2-trade cap blocks it; an opposite-side setup keeps its own state until it expires, is cancelled or confirms; when an entry fills, any remaining setup is cancelled, because its extreme is not after the exit bar
  - One position per symbol at a time; a setup cannot form while a position is open; a re-entry needs a new extreme bar formed after the bar on which the previous trade exited; at most 2 trades per symbol per session, and the run reports how often that cap blocks a confirmation
exit:
  - Target is the live session VWAP, worked as a limit order - on each bar j in the trade, the target is VWAP as of the close of bar j-1; a long exits when High[j] >= that target, a short when Low[j] <= it, filled at the target, or at Open[j] when the bar opens already beyond the target
  - When one bar reaches both the stop and the target, the stop is assumed to fill first
  - Standing time exit at 14:45 from the deployment profile, before the 15:00 MIS square-off; no position is held overnight
stop:
  - Long stop = extreme - 0.20 x ATR14_5m, short stop = extreme + 0.20 x ATR14_5m, where the extreme is the setup's latest extreme and ATR14_5m is the value at that extreme bar's close (a deeper extreme that replaces the setup restates both); the stop is fixed at entry and never trailed
take_profit:
  - Session VWAP, recomputed each bar as stated in exit; there is no fixed price target and no partial exit
holding_period: Intraday only; every position is closed by 14:45 on the session it opened

indicators:
  - {name: VWAP, anchor: session, source: hlc3}
  - {name: VWAP_SD, anchor: session, source: hlc3}
  - {name: EMA, period: 9, source: close}
  - {name: ATR, period: 14, source: close}
  - {name: EMA_15M, period: 20, source: close}
  - {name: ATR_15M, period: 14, source: close}
  - {name: ADX_15M, period: 14, source: close}
parameters:
  vwap_sd: 2.0
  atr_period_5m: 14
  min_vwap_distance_atr: 0.75
  stop_buffer_atr: 0.20
  adx_period_15m: 14
  adx_max: 22.0
  ema_regime_period_15m: 20
  ema_regime_lookback_bars: 4
  ema_regime_max_change_atr: 0.25
  atr_period_15m: 14
  ema_entry_period_5m: 9
  arm_bars: 6
  warmup_15m_bars: 100

timing:
  signal_evaluation: bar_close
  order_submission: signal_close
  fill_model: next_bar_open

# What a decision may read. Every moving value is the value knowable at the decision time.
information_boundary:
  - A decision at the close of 5m bar k reads only bars with open time <= k
  - VWAP, VWAP SD and the bands at bar k include bar k and no later bar
  - EMA9 and ATR14 on 5m at bar k include bar k and no later bar
  - A 15m bar, and EMA20, ATR14 and ADX14 on it, is used only after all three of its 5m bars are completed
  - The target used on bar j is VWAP as of the close of bar j-1, never bar j
  - The stop is fixed from the extreme bar's low or high and its ATR14_5m, both known at the extreme bar's close
  - The skip rule at entry reads only the entry bar's open, which is known when the order would fill

filters: none
session_window:
  entry: "09:20-14:15"

re_entry:
  allowed: true
  max_per_symbol_day: 2
  trigger: same_signal

# risk_per_trade_pct is informational: every trade is a fixed Rs 1,00,000 notional and costs are
# priced at that notional.
sizing:
  basis: fixed_notional
  risk_per_trade_pct: 1.0
  capital_per_trade: 100000

portfolio:
  mode: single_position
  scope: per_symbol

disclosure:
  prior_variants: 0
  chart_peeking: false
  destination: python

rationale: Tests whether a large excursion beyond the session VWAP 2SD band in a range-bound 15m regime reverts toward VWAP after the extreme is rejected. All twelve open draft decisions were resolved in the 2026-10-06 review before this freeze. Costs are the platform per-trade India MIS model at the fixed notional; the draft's 32 bps round trip is reported only as a secondary reference line.

kill_criterion: Net expectancy per trade is zero or negative after modelled costs.
