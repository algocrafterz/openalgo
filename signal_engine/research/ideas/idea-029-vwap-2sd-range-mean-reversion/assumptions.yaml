- id: A-009
  field: entry
  section: intent
  value:
  - Bars are 5m, open-time stamped, IST; a bar is completed at its open time plus
    5 minutes and every rule below reads completed bars only
  - Session VWAP and SD reset each session and accumulate from the 09:15 bar; typical
    price tp = (High + Low + Close) / 3; VWAP = sum(volume x tp) / sum(volume); SD
    = sqrt(max(sum(volume x tp^2) / sum(volume) - VWAP^2, 0)); bands are VWAP +/-
    2.0 x SD; every value is as of the close of the bar it belongs to, including that
    bar
  - EMA9 of close and Wilder ATR14 on 5m bars run continuously across eligible sessions;
    an excluded session contributes no observation and does not reset them
  - The 15m series is built from the 5m bars of each eligible session in fixed blocks
    of three starting at 09:15 (09:15, 09:30, ..., 15:00), so a session has 24 15m
    bars; a 15m bar is completed at its open time plus 15 minutes; ADX14, EMA20 and
    Wilder ATR14 on 15m run continuously across eligible sessions with no reset
  - Regime is valid when, on the latest completed 15m bar whose close is at or before
    the decision bar's close, ADX14 <= 22 and abs(EMA20[t] - EMA20[t-4]) <= 0.25 x
    ATR14_15m[t], where t-4 is four completed 15m bars earlier
  - Warm-up - a symbol generates no signal until at least 100 completed 15m bars from
    eligible sessions exist for it, counted from its first eligible observation in
    the dataset
  - Long arming - a completed 5m bar e arms a long setup when Low[e] <= lower band[e]
    and (VWAP[e] - Low[e]) / ATR14_5m[e] >= 0.75; the extreme is Low[e]
  - While armed, each later completed bar k is evaluated in this order - (1) if Low[k]
    < extreme, bar k replaces the setup when it passes the same band and 0.75 ATR
    displacement test (the extreme becomes Low[k], the arm window restarts from k),
    else the setup is cancelled; (2) if High[k] >= VWAP[k] the setup is cancelled;
    (3) if Close[k] > EMA9[k] and Close[k] > lower band[k] and the regime is valid
    at k, bar k is the confirmation bar
  - A setup stays armed for at most 6 completed bars after the extreme bar (arm_bars
    6) and is cancelled at the entry cutoff; the extreme bar itself cannot confirm
  - Entry is a market order at the open of the bar after the confirmation bar; the
    trade is skipped, not entered and exited, when that open is at or above the target
    or at or below the stop for a long
  - Short is the mirror image - High[e] >= upper band[e] and (High[e] - VWAP[e]) /
    ATR14_5m[e] >= 0.75, a higher high replaces or cancels the setup, Low[k] <= VWAP[k]
    cancels it, confirmation is Close[k] < EMA9[k] and Close[k] < upper band[k] with
    a valid regime
  - The first possible confirmation bar is the 09:15 bar, completed at 09:20, so the
    first entry fill is at the 09:20 open; the last entry fill is at the 14:15 open
  - One position per symbol at a time; a setup cannot form while a position is open;
    a re-entry needs a new extreme bar formed after the bar on which the previous
    trade exited; at most 2 trades per symbol per session, and the run reports how
    often that cap blocks a confirmation
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-010
  field: exit
  section: intent
  value:
  - Target is the live session VWAP, worked as a limit order - on each bar j in the
    trade, the target is VWAP as of the close of bar j-1; a long exits when High[j]
    >= that target, a short when Low[j] <= it, filled at the target, or at Open[j]
    when the bar opens already beyond the target
  - When one bar reaches both the stop and the target, the stop is assumed to fill
    first
  - Standing time exit at 14:45 from the deployment profile, before the 15:00 MIS
    square-off; no position is held overnight
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-011
  field: stop
  section: intent
  value:
  - Long stop = extreme - 0.20 x ATR14_5m, short stop = extreme + 0.20 x ATR14_5m,
    where the extreme is the setup's latest extreme and ATR14_5m is the value at the
    confirmation bar's close; the stop is fixed at entry and never trailed
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
