- id: A-031
  field: information_boundary
  section: intent
  value:
  - A decision at the close of 5m bar k reads only bars with open time <= k
  - VWAP, VWAP SD and the bands at bar k include bar k and no later bar
  - EMA9 and ATR14 on 5m at bar k include bar k and no later bar
  - A 15m bar, and EMA20, ATR14 and ADX14 on it, is used only after all three of its
    5m bars are completed
  - The target used on bar j is VWAP as of the close of bar j-1, never bar j
  - The stop is fixed from values at the confirmation bar's close
  - The skip rule at entry reads only the entry bar's open, which is known when the
    order would fill
  source: user
  confidence: high
  materiality: medium
  reason: stated in spec.yaml
  user_confirmed: true
