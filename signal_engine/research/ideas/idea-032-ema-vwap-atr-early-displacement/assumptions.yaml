- id: A-009
  field: entry
  section: intent
  value:
  - displacement = (EMA9 of close - session VWAP of hlc3) / ATR14, computed on every
    completed 5m bar
  - Long when displacement on the previous bar <= -0.50 and displacement on the current
    bar > -0.50
  - Short when displacement on the previous bar >= 0.50 and displacement on the current
    bar < 0.50
  - The signal is evaluated at the bar close and the order fills at the next candle
    open
  - Displacement crossing zero is not an entry condition and the WATCH levels at -0.35
    and 0.35 never generate a trade
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-010
  field: exit
  section: intent
  value:
  - Long exits when displacement on the current bar >= 0 (the EMA9 has reached or
    crossed above VWAP); filled at the next candle open
  - Short exits when displacement on the current bar <= 0; filled at the next candle
    open
  - Standing profile time exit applies to any position still open, and no position
    is held overnight
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
