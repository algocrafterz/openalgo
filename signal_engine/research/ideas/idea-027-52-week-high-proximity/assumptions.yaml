- id: A-009
  field: entry
  section: intent
  value:
  - On each weekly rebalance day (the last session of the week), after the daily close,
    compute for every eligible stock the ratio of its close to the highest daily close
    of the trailing 252 sessions including that day
  - A stock qualifies when that ratio is at least 0.95, meaning its close is within
    5% of the 252-session high close
  - Hold the 20 qualifying stocks with the highest ratio; if fewer than 20 qualify,
    hold only those and keep the rest of the capital in cash
  - Buy orders fill at the next session's open
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-010
  field: exit
  section: intent
  value:
  - On each weekly rebalance day, sell every held stock that is not among the 20 qualifying
    stocks with the highest ratio, whether because its ratio fell below 0.95 or because
    it is outranked
  - Sell orders fill at the next session's open
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
