schema_version: 2
name: Multi-day balance breakout
source:
  kind: own_words
  ref: _inbox/multi-day-balance-breakout.txt
profile: flattrade-nse-cash
style: intraday
direction: both
timeframe: 5m
product: MIS
data:
  frequency: 5m
  field_families: [price, volume]
  min_n_minutes: 1
  complete_bins: {first: "09:15", last: "15:10"}
entry:
  - "Balance on trade day t from the last 5 completed sessions only: adjacent 70 percent value areas overlap by at least 0.5 of the narrower one, and composite height H = max(VAH) - min(VAL) is at most 1.5 x daily ATR14"
  - "Long: a 30-minute period close (periods anchored 09:15, closing 10:15 through 12:45) above the composite high while the previous 30-minute close was at or below it; short mirrors below the composite low"
  - "First such breakout of the day only, one trade per stock per day; the order fills at the next 5m candle open"
exit:
  - "Measured-move target: composite high + H for a long, composite low - H for a short"
  - "Time exit at 14:45"
stop:
  - "Long: composite high - 0.25 x daily ATR14; short: composite low + 0.25 x daily ATR14"
take_profit:
  - "Composite edge projected by H in the trade direction"
holding_period: same_session
indicators:
  - {name: ATR, period: 14}
parameters:
  balance_days: 5
  atr_max_multiple: 1.5
  value_area_pct: 70
  bin_pct_of_price: 0.05
  min_va_overlap: 0.5
  atr_len: 14
  stop_buffer_atr: 0.25
  min_session_bars: 60
  trigger: p30
  stop_mode: edge
  placebo: none
filters: none
session_window: {entry: "10:15-13:00"}
re_entry:
  allowed: false
sizing:
  risk_per_trade_pct: 1.0
  capital_per_trade: 100000
portfolio:
  mode: multi_position
  max_concurrent: 213
  max_trades_per_day: 213
  capital_per_position: 100000
  max_exposure: 21300000
  selection: chronological
  conflict: skip_if_symbol_open
disclosure:
  prior_variants: 0
  chart_peeking: false
  destination: python
rationale: A multi-day overlapping value area is agreed value; price accepted outside it moves to new value, and the level is known before the move.
kill_criterion: Net expectancy not above zero out of sample after statutory costs plus 4 bps slippage per side, or no gain over the non-balance placebo.
