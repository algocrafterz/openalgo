- id: A-009
  field: entry
  section: intent
  value:
  - On each rebalance day, the last session of each calendar month that has a next
    session, after the daily close, compute for every eligible stock the daily return
    r_t = Close_t / Close_(t-1) - 1 for each of the trailing 252 sessions, on the
    published adjusted closes
  - A stock is ranked only when it has 253 consecutive closes on the official NSE
    sessions ending on the rebalance day, which gives 252 consecutive daily returns;
    a stock missing any session in that window is not ranked on that rebalance day
  - Volatility is the sample standard deviation with ddof 1 of those 252 returns,
    not annualised
  - Rank the ranked stocks from lowest to highest volatility; ties are broken by the
    platform's hash of symbol and date
  - Hold the 30 stocks with the lowest volatility; a held stock that is still among
    the 30 is kept, not sold and bought again
  - Buy orders for stocks that newly enter the 30 fill at the next session's open
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
- id: A-010
  field: exit
  section: intent
  value:
  - On each rebalance day, sell every held stock that is not among the 30 lowest-volatility
    ranked stocks, including a held stock that is not ranked that day
  - Sell orders fill at the next session's open
  source: user
  confidence: high
  materiality: high
  reason: stated in spec.yaml
  user_confirmed: true
