# NSE CM intraday session template: which minutes a 1m bar may carry, by date range.
#
# Kept apart from nse_calendar.yaml on purpose: that file's sha256 is the calendar version that
# published daily datasets and sealed runs record, so an edit there would change it. This file is
# used only by the intraday dataset build (INTRADAY-5M-DATASET-PLAN.md section 7.4); its sha256 is
# recorded in that dataset's contract.
#
# Times are IST minute stamps of 1m bars (a bar stamped 15:29 covers 15:29:00-15:29:59).
#   continuous       continuous-trading windows, each [first minute, last minute]
#   closing_auction  minute stamps on which the closing-auction print may appear; null before CAS
#
# The first template whose date range covers a session applies, so single-day special sessions
# are listed first. Muhurat sessions have no template: they are out of scope for the intraday
# dataset (plan section 9).
#
# Added 2026-10-20 (conversion spec 2, approvals P3a and P3b):
#   non_regular_zones  minute ranges whose bars are NEVER regular-session bars: the post-3-Aug
#                      closing window and, on two special days, the DR-site pre-open, the closing
#                      session and the re-opening call. A bar there is quarantined and counted
#                      (closing_noise_bars), not a structure error; its volume never enters the
#                      regular-session volume. The single auction print stays a separate field.
#   verification       absent = the hours rest on an NSE circular already in nse_calendar.yaml.
#                      `partial` = the hours were established from the data (a bar present for at
#                      least half of the symbols in a minute) and from press reports of the NSE
#                      announcement; the primary NSE circular text was not retrievable. A bar
#                      outside every window and zone still fails structure, so a session or symbol
#                      whose hours are not established is excluded, never inferred.

schema: 1
templates:
  - from: 2021-02-24
    to: 2021-02-24
    continuous: [["09:15", "11:41"], ["15:44", "16:59"]]
    closing_auction: null
    non_regular_zones: [["15:30", "15:43"]]
    verification: partial
    source: >-
      NSE outage day. Press reports (Bloomberg Quint, Angel One, money9, 2021-02-24 and 25): trading
      halted at 11:40, resumed from 15:30 and hours were extended to 17:00 on NSE, BSE and MSEI.
      Data, 188 symbols (2026-10-20): at least half of them have a bar in every minute of
      09:15-11:41 and 15:44-16:59 and in 15:36 only inside 15:30-15:43 (the re-opening call). NSE
      daily volume reconciles with these windows (all bars / NSE = 0.985, 23.7% of the volume
      after 15:29).
  - from: 2024-03-02
    to: 2024-03-02
    continuous: [["09:15", "09:59"], ["11:30", "12:29"]]
    closing_auction: null
    non_regular_zones: [["11:15", "11:29"], ["12:30", "12:50"]]
    verification: partial
    source: >-
      NSE special live session with an intraday switch to the DR site (nse_calendar.yaml). The NSE
      announcement of 2024-02-14, as quoted by Business Standard, Business Today and Zerodha: primary
      site 09:15-10:00, DR site 11:30-12:30, pre-open of the second session 11:15-11:23 and a closing
      session 12:40-12:50. Data, 203 symbols: bars at 11:15-11:22 and 12:40-12:49 for most of them.
  - from: 2024-05-18
    to: 2024-05-18
    continuous: [["09:15", "09:59"], ["11:30", "12:29"]]
    closing_auction: null
    source: NSE special live session with an intraday switch to the DR site (nse_calendar.yaml)
  - from: 2016-01-01
    to: 2026-07-31
    continuous: [["09:15", "15:29"]]
    closing_auction: null
    source: NSE CM market timings (normal market 09:15-15:30)
  - from: 2026-08-03
    to: null
    continuous: [["09:15", "15:14"]]
    closing_auction: ["15:28", "15:29"]
    non_regular_zones: [["15:15", "15:29"]]
    source: >-
      Closing Auction Session, SEBI circular 16 Jan 2026; NSE/CMTR/73362 (18 Mar 2026); live
      3 Aug 2026 (NSE/CMTR/75479). Continuous trading ends 15:15. Print stamps measured on
      AngelOne 1m data 2026-08-03 to 2026-10-01 (361 bars: 09:15-15:14 plus one at 15:28/15:29).
