# NSE Capital Market (CM) segment trading calendar. Authoritative and versioned.
#
# Built from NSE circulars only. It is never derived from the Historify store or any vendor data.
# The version is the sha256 of this file's bytes, so any edit (comments included) is a new version.
# Loader and validation: signal_engine/backtest/data_readiness/calendar.py.
#
# Sections
#   years             one block per covered year: the annual holiday circular.
#   holidays          WEEKDAY closures only. Holidays that fall on a Saturday or Sunday are not
#                     listed (the weekend already closes the market). Entries added after the
#                     annual circular carry their own `source`.
#   special_sessions  live sessions outside the normal weekday pattern: Muhurat trading, Union
#                     Budget weekend sessions, and weekend live sessions (DR drills, rescheduled
#                     days). A Muhurat session may fall on a listed weekday holiday; any other
#                     special session must fall on a weekend.
#   mock_sessions     NOT trading sessions. Mock trading on a weekend. Data stamped on these dates
#                     is not real. This list is NOT exhaustive: NSE runs mock sessions on many
#                     Saturdays. Only mocks with a found circular are listed.
#   unconfirmed       dates where data was observed but no NSE source confirms a session (D10).
#                     They classify as `unknown`, so data on them is an ERROR until confirmed.
#
# Verification (2026-10-04). Every date from 2016-01-01 to 2026-10-03 was checked against the NSE
# CM bhavcopy archive (NSE's own published end-of-day record, one file per trading day):
#   old format  https://nsearchives.nseindia.com/content/historical/EQUITIES/<YYYY>/<MON>/cm<DD><MON><YYYY>bhav.csv.zip  (to 2024-07-05)
#   new format  https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_<YYYYMMDD>_F_0000.csv.zip  (from 2024-07-08)
# Result: every weekday without a bhavcopy is listed below as a holiday, every listed holiday has
# no bhavcopy, and the only weekend dates with a bhavcopy are the special sessions listed below.
# This is a cross-check of the circulars, not the source of the calendar. Dates after 2026-10-03
# rest on the 2026 circular alone and may still be amended by NSE.

