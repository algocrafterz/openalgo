<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- IB Range Box -->
  <rect x="200" y="200" width="800" height="200" rx="0" fill="#f59e0b" opacity="0.04" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="170" y="205" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="end">IB High</text>
  <text x="170" y="405" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="end">IB Low</text>
  <!-- Coiled spring energy inside IB -->
  <g opacity="0.3">
    <path d="M300,300 Q350,250 400,300 Q450,350 500,300 Q550,250 600,300 Q650,350 700,300 Q750,250 800,300" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <!-- Price action inside IB -->
  <polyline points="220,320 280,270 340,310 400,240 460,280 520,260 580,290 640,230 700,270 760,250 800,260" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.5"/>
  <!-- BREAKOUT! -->
  <g filter="url(#glow)">
    <path d="M800,260 L850,200 L860,195 L880,160 L900,120 L920,90 L950,50" fill="none" stroke="#22D3EE" stroke-width="4"/>
    <polygon points="942,60 950,35 958,60" fill="#22D3EE"/>
  </g>
  <!-- Explosion at breakout point -->
  <circle cx="850" cy="200" r="40" fill="#22D3EE" opacity="0.08" filter="url(#bigGlow)"/>
  <circle cx="850" cy="200" r="20" fill="#22D3EE" opacity="0.1" filter="url(#glow)"/>
  <!-- Shatter fragments -->
  <g fill="#f59e0b" opacity="0.4">
    <rect x="830" y="190" width="15" height="6" rx="1" transform="rotate(-30,837,193)"/>
    <rect x="855" y="185" width="12" height="5" rx="1" transform="rotate(25,861,187)"/>
    <rect x="840" y="178" width="10" height="5" rx="1" transform="rotate(-45,845,180)"/>
    <rect x="860" y="195" width="14" height="5" rx="1" transform="rotate(40,867,197)"/>
  </g>
  <!-- Energy particles -->
  <g filter="url(#glow)">
    <circle cx="870" cy="150" r="3" fill="#22D3EE" opacity="0.6"><animate attributeName="cy" values="150;140;150" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="100" r="2.5" fill="#22D3EE" opacity="0.5"><animate attributeName="cy" values="100;90;100" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="70" r="2" fill="#22D3EE" opacity="0.7"><animate attributeName="cy" values="70;60;70" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="170" r="2" fill="#38ef7d" opacity="0.4"/>
    <circle cx="880" cy="130" r="2" fill="#38ef7d" opacity="0.3"/>
  </g>
  <!-- Trade setup annotation -->
  <g transform="translate(960, 80)">
    <rect width="200" height="150" rx="12" fill="#1e293b" opacity="0.7" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.3"/>
    <text x="100" y="30" fill="#f1f5f9" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">Trade Setup</text>
    <circle cx="20" cy="55" r="5" fill="#38ef7d"/><text x="35" y="59" fill="#38ef7d" font-family="system-ui" font-size="12">Entry: IB High break</text>
    <circle cx="20" cy="85" r="5" fill="#22D3EE"/><text x="35" y="89" fill="#22D3EE" font-family="system-ui" font-size="12">Target: 1.5× IB range</text>
    <circle cx="20" cy="115" r="5" fill="#f87171"/><text x="35" y="119" fill="#f87171" font-family="system-ui" font-size="12">Stop: Mid-IB or IB Low</text>
  </g>
  <!-- Clock showing 10:15 -->
  <g transform="translate(100, 450)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
    <line x1="50" y1="50" x2="50" y2="22" stroke="#f59e0b" stroke-width="2.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="65" y2="55" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <circle cx="50" cy="50" r="3" fill="#f59e0b" opacity="0.6"/>
    <text x="50" y="120" fill="#f59e0b" font-family="system-ui" font-size="12" text-anchor="middle" opacity="0.7">IB forms by 10:15 AM</text>
    <text x="50" y="140" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle">Watch for breakout after</text>
  </g>
</svg>
