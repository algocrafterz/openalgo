<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bgGlow"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="#818CF8" opacity="0.05" filter="url(#bgGlow)"/>
  <!-- Step indicators at top -->
  <g transform="translate(150, 40)">
    <circle cx="0" cy="0" r="20" fill="#6366f1" filter="url(#glow)"/><text x="0" y="6" fill="#fff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <line x1="25" y1="0" x2="275" y2="0" stroke="#334155" stroke-width="2"/>
    <circle cx="300" cy="0" r="20" fill="#22D3EE" filter="url(#glow)"/><text x="300" y="6" fill="#fff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <line x1="325" y1="0" x2="575" y2="0" stroke="#334155" stroke-width="2"/>
    <circle cx="600" cy="0" r="20" fill="#38ef7d" filter="url(#glow)"/><text x="600" y="6" fill="#fff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <line x1="625" y1="0" x2="875" y2="0" stroke="#334155" stroke-width="2"/>
    <circle cx="900" cy="0" r="20" fill="#f59e0b" filter="url(#glow)"/><text x="900" y="6" fill="#fff" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="0" y="50" fill="#6366f1" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">Identify Shape</text>
    <text x="300" y="50" fill="#22D3EE" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">Find POC &amp; VA</text>
    <text x="600" y="50" fill="#38ef7d" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">Read the Tails</text>
    <text x="900" y="50" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">Context Check</text>
  </g>
  <!-- Large central Market Profile chart -->
  <g transform="translate(250, 120)">
    <rect width="700" height="420" rx="16" fill="#1e293b" opacity="0.4" stroke="#334155" stroke-width="1"/>
    <!-- Price axis -->
    <line x1="60" y1="20" x2="60" y2="400" stroke="#475569" stroke-width="1.5"/>
    <g fill="#64748b" font-family="monospace" font-size="10">
      <text x="50" y="60" text-anchor="end">540</text><text x="50" y="110" text-anchor="end">535</text>
      <text x="50" y="160" text-anchor="end">530</text><text x="50" y="210" text-anchor="end">525</text>
      <text x="50" y="260" text-anchor="end">520</text><text x="50" y="310" text-anchor="end">515</text>
      <text x="50" y="360" text-anchor="end">510</text>
    </g>
    <!-- TPO blocks -->
    <g filter="url(#glow)">
      <!-- Tail top -->
      <rect x="70" y="50" width="30" height="14" rx="3" fill="#f59e0b" opacity="0.5"/>
      <rect x="70" y="70" width="50" height="14" rx="3" fill="#f59e0b" opacity="0.6"/>
      <!-- Body -->
      <rect x="70" y="100" width="120" height="14" rx="3" fill="#818CF8" opacity="0.6"/>
      <rect x="70" y="120" width="200" height="14" rx="3" fill="#818CF8" opacity="0.7"/>
      <rect x="70" y="140" width="320" height="14" rx="3" fill="#818CF8" opacity="0.8"/>
      <!-- VA zone highlighted -->
      <rect x="65" y="155" width="5" height="120" fill="#22D3EE" opacity="0.3" rx="2"/>
      <rect x="70" y="160" width="400" height="14" rx="3" fill="#22D3EE" opacity="0.85"/>
      <rect x="70" y="180" width="450" height="14" rx="3" fill="#22D3EE" opacity="0.9"/>
      <!-- POC -->
      <rect x="70" y="200" width="500" height="14" rx="3" fill="#22D3EE"/>
      <rect x="70" y="220" width="450" height="14" rx="3" fill="#22D3EE" opacity="0.9"/>
      <rect x="70" y="240" width="400" height="14" rx="3" fill="#22D3EE" opacity="0.85"/>
      <rect x="70" y="260" width="320" height="14" rx="3" fill="#818CF8" opacity="0.8"/>
      <rect x="70" y="280" width="200" height="14" rx="3" fill="#818CF8" opacity="0.7"/>
      <rect x="70" y="300" width="120" height="14" rx="3" fill="#818CF8" opacity="0.6"/>
      <!-- Tail bottom -->
      <rect x="70" y="330" width="50" height="14" rx="3" fill="#f59e0b" opacity="0.6"/>
      <rect x="70" y="350" width="30" height="14" rx="3" fill="#f59e0b" opacity="0.5"/>
    </g>
    <!-- POC line annotation -->
    <line x1="575" y1="207" x2="620" y2="207" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="625" y="212" fill="#22D3EE" font-family="system-ui" font-size="12" font-weight="600">POC</text>
    <!-- VA bracket -->
    <text x="625" y="175" fill="#818CF8" font-family="system-ui" font-size="11">VAH</text>
    <text x="625" y="265" fill="#818CF8" font-family="system-ui" font-size="11">VAL</text>
    <rect x="618" y="163" width="3" height="95" fill="#818CF8" opacity="0.4" rx="1"/>
    <!-- Tail annotations -->
    <text x="115" y="45" fill="#f59e0b" font-family="system-ui" font-size="10" opacity="0.7">↑ Seller rejection</text>
    <text x="115" y="380" fill="#f59e0b" font-family="system-ui" font-size="10" opacity="0.7">↓ Buyer rejection</text>
    <!-- Interactive cursor -->
    <circle cx="320" cy="207" r="8" fill="none" stroke="#f1f5f9" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
