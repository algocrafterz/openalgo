<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left panel: Volume Profile -->
  <g transform="translate(30, 40)">
    <rect width="520" height="550" rx="16" fill="#1e293b" opacity="0.4" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="260" y="40" fill="#22D3EE" font-family="system-ui" font-size="20" font-weight="800" text-anchor="middle">Volume Profile</text>
    <text x="260" y="65" fill="#64748b" font-family="system-ui" font-size="12" text-anchor="middle">HOW MUCH was traded at each price</text>
    <!-- Price axis -->
    <line x1="70" y1="90" x2="70" y2="440" stroke="#475569" stroke-width="1"/>
    <!-- Volume bars (horizontal) -->
    <g filter="url(#glow)">
      <rect x="75" y="95" width="60" height="16" rx="3" fill="#22D3EE" opacity="0.3"/>
      <rect x="75" y="117" width="100" height="16" rx="3" fill="#22D3EE" opacity="0.4"/>
      <rect x="75" y="139" width="160" height="16" rx="3" fill="#22D3EE" opacity="0.5"/>
      <rect x="75" y="161" width="240" height="16" rx="3" fill="#22D3EE" opacity="0.6"/>
      <rect x="75" y="183" width="320" height="16" rx="3" fill="#22D3EE" opacity="0.75"/>
      <rect x="75" y="205" width="380" height="16" rx="3" fill="#06b6d4" opacity="0.85"/>
      <rect x="75" y="227" width="410" height="16" rx="3" fill="#06b6d4"/>
      <rect x="75" y="249" width="380" height="16" rx="3" fill="#06b6d4" opacity="0.85"/>
      <rect x="75" y="271" width="320" height="16" rx="3" fill="#22D3EE" opacity="0.75"/>
      <rect x="75" y="293" width="240" height="16" rx="3" fill="#22D3EE" opacity="0.6"/>
      <rect x="75" y="315" width="160" height="16" rx="3" fill="#22D3EE" opacity="0.5"/>
      <rect x="75" y="337" width="100" height="16" rx="3" fill="#22D3EE" opacity="0.4"/>
      <rect x="75" y="359" width="60" height="16" rx="3" fill="#22D3EE" opacity="0.3"/>
    </g>
    <!-- VPOC marker -->
    <text x="495" y="240" fill="#06b6d4" font-family="system-ui" font-size="11" font-weight="600" text-anchor="end">← VPOC</text>
    <!-- Labels -->
    <g font-family="system-ui" font-size="11" fill="#94a3b8">
      <text x="80" y="470">Measures: Volume (quantity)</text>
      <text x="80" y="490">Best for: Swing trades, multi-day</text>
      <text x="80" y="510">Shows: High/Low Volume Nodes</text>
      <text x="80" y="530">Timeframe: Days to weeks</text>
    </g>
  </g>
  <!-- VS divider -->
  <line x1="600" y1="50" x2="600" y2="580" stroke="#334155" stroke-width="1" stroke-dasharray="6,6"/>
  <circle cx="600" cy="315" r="24" fill="#1e293b" stroke="#818CF8" stroke-width="2"/>
  <text x="600" y="322" fill="#818CF8" font-family="system-ui" font-size="14" font-weight="800" text-anchor="middle">VS</text>
  <!-- Right panel: Market Profile -->
  <g transform="translate(650, 40)">
    <rect width="520" height="550" rx="16" fill="#1e293b" opacity="0.4" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="260" y="40" fill="#818CF8" font-family="system-ui" font-size="20" font-weight="800" text-anchor="middle">Market Profile</text>
    <text x="260" y="65" fill="#64748b" font-family="system-ui" font-size="12" text-anchor="middle">HOW LONG price stayed at each level</text>
    <!-- Price axis -->
    <line x1="70" y1="90" x2="70" y2="440" stroke="#475569" stroke-width="1"/>
    <!-- TPO blocks -->
    <g filter="url(#glow)">
      <rect x="75" y="95" width="35" height="16" rx="3" fill="#818CF8" opacity="0.4"/>
      <rect x="75" y="117" width="70" height="16" rx="3" fill="#818CF8" opacity="0.5"/>
      <rect x="75" y="139" width="120" height="16" rx="3" fill="#818CF8" opacity="0.6"/>
      <rect x="75" y="161" width="180" height="16" rx="3" fill="#818CF8" opacity="0.7"/>
      <rect x="75" y="183" width="260" height="16" rx="3" fill="#6366f1" opacity="0.8"/>
      <rect x="75" y="205" width="340" height="16" rx="3" fill="#6366f1" opacity="0.85"/>
      <rect x="75" y="227" width="380" height="16" rx="3" fill="#818CF8"/>
      <rect x="75" y="249" width="340" height="16" rx="3" fill="#6366f1" opacity="0.85"/>
      <rect x="75" y="271" width="260" height="16" rx="3" fill="#6366f1" opacity="0.8"/>
      <rect x="75" y="293" width="180" height="16" rx="3" fill="#818CF8" opacity="0.7"/>
      <rect x="75" y="315" width="120" height="16" rx="3" fill="#818CF8" opacity="0.6"/>
      <rect x="75" y="337" width="70" height="16" rx="3" fill="#818CF8" opacity="0.5"/>
      <rect x="75" y="359" width="35" height="16" rx="3" fill="#818CF8" opacity="0.4"/>
    </g>
    <!-- TPO POC marker -->
    <text x="465" y="240" fill="#818CF8" font-family="system-ui" font-size="11" font-weight="600" text-anchor="end">← TPO POC</text>
    <!-- Labels -->
    <g font-family="system-ui" font-size="11" fill="#94a3b8">
      <text x="80" y="470">Measures: Time (30-min periods)</text>
      <text x="80" y="490">Best for: Intraday, day trading</text>
      <text x="80" y="510">Shows: Day types, IB, auctions</text>
      <text x="80" y="530">Timeframe: Single session</text>
    </g>
  </g>
</svg>
