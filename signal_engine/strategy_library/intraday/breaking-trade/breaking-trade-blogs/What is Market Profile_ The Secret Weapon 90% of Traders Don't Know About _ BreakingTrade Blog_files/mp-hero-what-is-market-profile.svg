<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#818CF8"/></linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <ellipse cx="600" cy="350" rx="350" ry="200" fill="#818CF8" opacity="0.07" filter="url(#blur1)"/>
  <ellipse cx="500" cy="300" rx="200" ry="120" fill="#22D3EE" opacity="0.05" filter="url(#blur1)"/>
  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="200" y1="100" x2="200" y2="530"/><line x1="350" y1="100" x2="350" y2="530"/>
    <line x1="500" y1="100" x2="500" y2="530"/><line x1="650" y1="100" x2="650" y2="530"/>
    <line x1="800" y1="100" x2="800" y2="530"/><line x1="950" y1="100" x2="950" y2="530"/>
    <line x1="200" y1="150" x2="950" y2="150"/><line x1="200" y1="250" x2="950" y2="250"/>
    <line x1="200" y1="350" x2="950" y2="350"/><line x1="200" y1="450" x2="950" y2="450"/>
  </g>
  <!-- Price axis -->
  <line x1="200" y1="100" x2="200" y2="530" stroke="#475569" stroke-width="2"/>
  <!-- Bell curve / Market Profile shape -->
  <g filter="url(#glow)">
    <!-- TPO blocks forming bell curve -->
    <rect x="220" y="140" width="40" height="18" rx="3" fill="#818CF8" opacity="0.4"/>
    <rect x="220" y="165" width="80" height="18" rx="3" fill="#818CF8" opacity="0.5"/>
    <rect x="220" y="190" width="160" height="18" rx="3" fill="#818CF8" opacity="0.6"/>
    <rect x="220" y="215" width="280" height="18" rx="3" fill="#818CF8" opacity="0.7"/>
    <rect x="220" y="240" width="400" height="18" rx="3" fill="#6366f1" opacity="0.8"/>
    <rect x="220" y="265" width="520" height="18" rx="3" fill="#818CF8" opacity="0.85"/>
    <rect x="220" y="290" width="600" height="18" rx="3" fill="#22D3EE" opacity="0.9"/>
    <rect x="220" y="315" width="640" height="18" rx="3" fill="#22D3EE" opacity="1.0"/>
    <rect x="220" y="340" width="600" height="18" rx="3" fill="#22D3EE" opacity="0.9"/>
    <rect x="220" y="365" width="520" height="18" rx="3" fill="#818CF8" opacity="0.85"/>
    <rect x="220" y="390" width="400" height="18" rx="3" fill="#6366f1" opacity="0.8"/>
    <rect x="220" y="415" width="280" height="18" rx="3" fill="#818CF8" opacity="0.7"/>
    <rect x="220" y="440" width="160" height="18" rx="3" fill="#818CF8" opacity="0.6"/>
    <rect x="220" y="465" width="80" height="18" rx="3" fill="#818CF8" opacity="0.5"/>
    <rect x="220" y="490" width="40" height="18" rx="3" fill="#818CF8" opacity="0.4"/>
  </g>
  <!-- POC indicator -->
  <line x1="210" y1="324" x2="870" y2="324" stroke="#22D3EE" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>
  <circle cx="870" cy="324" r="6" fill="#22D3EE" filter="url(#glow)"/>
  <!-- Value Area bracket -->
  <rect x="900" y="260" width="4" height="140" rx="2" fill="#818CF8" opacity="0.6"/>
  <line x1="895" y1="260" x2="910" y2="260" stroke="#818CF8" stroke-width="2"/>
  <line x1="895" y1="400" x2="910" y2="400" stroke="#818CF8" stroke-width="2"/>
  <text x="920" y="335" fill="#818CF8" font-family="system-ui" font-size="13" opacity="0.8">70%</text>
  <!-- Floating particles -->
  <circle cx="700" cy="200" r="2" fill="#22D3EE" opacity="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="500" r="2" fill="#818CF8" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="180" r="1.5" fill="#22D3EE" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="130" r="1.5" fill="#818CF8" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
</svg>
