<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Title area -->
  <text x="600" y="50" fill="#f1f5f9" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle" opacity="0.6">6 Market Profile Day Types</text>
  <!-- Day Type 1: Normal Day -->
  <g transform="translate(60, 80)">
    <rect width="160" height="240" rx="14" fill="#1e293b" opacity="0.5" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
    <text x="80" y="30" fill="#6366f1" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Normal Day</text>
    <!-- Symmetric bell -->
    <g transform="translate(30,45)" filter="url(#glow)">
      <rect x="40" y="0" width="20" height="10" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="30" y="14" width="40" height="10" rx="2" fill="#6366f1" opacity="0.4"/>
      <rect x="20" y="28" width="60" height="10" rx="2" fill="#6366f1" opacity="0.5"/>
      <rect x="10" y="42" width="80" height="10" rx="2" fill="#6366f1" opacity="0.6"/>
      <rect x="5" y="56" width="90" height="10" rx="2" fill="#818CF8" opacity="0.8"/>
      <rect x="0" y="70" width="100" height="10" rx="2" fill="#818CF8" opacity="0.9"/>
      <rect x="0" y="84" width="100" height="10" rx="2" fill="#818CF8"/>
      <rect x="5" y="98" width="90" height="10" rx="2" fill="#818CF8" opacity="0.8"/>
      <rect x="10" y="112" width="80" height="10" rx="2" fill="#6366f1" opacity="0.6"/>
      <rect x="20" y="126" width="60" height="10" rx="2" fill="#6366f1" opacity="0.5"/>
      <rect x="30" y="140" width="40" height="10" rx="2" fill="#6366f1" opacity="0.4"/>
      <rect x="40" y="154" width="20" height="10" rx="2" fill="#6366f1" opacity="0.3"/>
    </g>
    <text x="80" y="225" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Balanced, symmetric</text>
  </g>
  <!-- Day Type 2: Normal Variation -->
  <g transform="translate(250, 80)">
    <rect width="160" height="240" rx="14" fill="#1e293b" opacity="0.5" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3"/>
    <text x="80" y="30" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Normal Variation</text>
    <!-- Elongated one side -->
    <g transform="translate(30,40)" filter="url(#glow)">
      <rect x="40" y="0" width="20" height="10" rx="2" fill="#a78bfa" opacity="0.3"/>
      <rect x="30" y="14" width="40" height="10" rx="2" fill="#a78bfa" opacity="0.4"/>
      <rect x="15" y="28" width="70" height="10" rx="2" fill="#a78bfa" opacity="0.5"/>
      <rect x="5" y="42" width="90" height="10" rx="2" fill="#a78bfa" opacity="0.7"/>
      <rect x="0" y="56" width="100" height="10" rx="2" fill="#c084fc" opacity="0.9"/>
      <rect x="0" y="70" width="100" height="10" rx="2" fill="#c084fc"/>
      <rect x="5" y="84" width="90" height="10" rx="2" fill="#a78bfa" opacity="0.8"/>
      <rect x="15" y="98" width="70" height="10" rx="2" fill="#a78bfa" opacity="0.6"/>
      <rect x="25" y="112" width="50" height="10" rx="2" fill="#a78bfa" opacity="0.5"/>
      <rect x="35" y="126" width="30" height="10" rx="2" fill="#a78bfa" opacity="0.4"/>
      <rect x="40" y="140" width="20" height="10" rx="2" fill="#a78bfa" opacity="0.3"/>
      <rect x="45" y="154" width="10" height="10" rx="2" fill="#a78bfa" opacity="0.25"/>
      <rect x="45" y="168" width="10" height="10" rx="2" fill="#a78bfa" opacity="0.2"/>
    </g>
    <text x="80" y="225" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">One-sided extension</text>
  </g>
  <!-- Day Type 3: Trend Day -->
  <g transform="translate(440, 80)">
    <rect width="160" height="240" rx="14" fill="#1e293b" opacity="0.5" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.3"/>
    <text x="80" y="30" fill="#22D3EE" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Trend Day</text>
    <!-- Thin elongated -->
    <g transform="translate(55,40)" filter="url(#glow)">
      <rect x="0" y="0" width="15" height="10" rx="2" fill="#22D3EE" opacity="0.4"/>
      <rect x="0" y="14" width="20" height="10" rx="2" fill="#22D3EE" opacity="0.5"/>
      <rect x="0" y="28" width="30" height="10" rx="2" fill="#22D3EE" opacity="0.6"/>
      <rect x="0" y="42" width="35" height="10" rx="2" fill="#22D3EE" opacity="0.7"/>
      <rect x="0" y="56" width="40" height="10" rx="2" fill="#22D3EE" opacity="0.8"/>
      <rect x="0" y="70" width="35" height="10" rx="2" fill="#22D3EE" opacity="0.7"/>
      <rect x="0" y="84" width="30" height="10" rx="2" fill="#22D3EE" opacity="0.6"/>
      <rect x="0" y="98" width="25" height="10" rx="2" fill="#22D3EE" opacity="0.5"/>
      <rect x="0" y="112" width="20" height="10" rx="2" fill="#22D3EE" opacity="0.45"/>
      <rect x="0" y="126" width="25" height="10" rx="2" fill="#22D3EE" opacity="0.5"/>
      <rect x="0" y="140" width="20" height="10" rx="2" fill="#22D3EE" opacity="0.4"/>
      <rect x="0" y="154" width="15" height="10" rx="2" fill="#22D3EE" opacity="0.35"/>
      <rect x="0" y="168" width="10" height="10" rx="2" fill="#22D3EE" opacity="0.3"/>
    </g>
    <!-- Directional arrow -->
    <path d="M120,185 L120,60" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.4" stroke-dasharray="4,3"/>
    <polygon points="116,65 120,50 124,65" fill="#22D3EE" opacity="0.5"/>
    <text x="80" y="225" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Thin, directional</text>
  </g>
  <!-- Day Type 4: Double Distribution -->
  <g transform="translate(630, 80)">
    <rect width="160" height="240" rx="14" fill="#1e293b" opacity="0.5" stroke="#e879f9" stroke-width="1" stroke-opacity="0.3"/>
    <text x="80" y="30" fill="#e879f9" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Double Distribution</text>
    <!-- Two bulges connected by thin neck -->
    <g transform="translate(30,40)" filter="url(#glow)">
      <rect x="20" y="0" width="60" height="10" rx="2" fill="#e879f9" opacity="0.5"/>
      <rect x="10" y="14" width="80" height="10" rx="2" fill="#e879f9" opacity="0.7"/>
      <rect x="5" y="28" width="90" height="10" rx="2" fill="#e879f9" opacity="0.9"/>
      <rect x="10" y="42" width="80" height="10" rx="2" fill="#e879f9" opacity="0.7"/>
      <rect x="30" y="56" width="40" height="10" rx="2" fill="#f59e0b" opacity="0.4"/>
      <rect x="35" y="70" width="30" height="10" rx="2" fill="#f59e0b" opacity="0.3"/>
      <rect x="35" y="84" width="30" height="10" rx="2" fill="#f59e0b" opacity="0.3"/>
      <rect x="30" y="98" width="40" height="10" rx="2" fill="#f59e0b" opacity="0.4"/>
      <rect x="10" y="112" width="80" height="10" rx="2" fill="#c084fc" opacity="0.7"/>
      <rect x="5" y="126" width="90" height="10" rx="2" fill="#c084fc" opacity="0.9"/>
      <rect x="10" y="140" width="80" height="10" rx="2" fill="#c084fc" opacity="0.7"/>
      <rect x="20" y="154" width="60" height="10" rx="2" fill="#c084fc" opacity="0.5"/>
    </g>
    <text x="80" y="225" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Two value areas</text>
  </g>
  <!-- Day Type 5: Non-Trend -->
  <g transform="translate(820, 80)">
    <rect width="160" height="240" rx="14" fill="#1e293b" opacity="0.5" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
    <text x="80" y="30" fill="#f59e0b" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Non-Trend</text>
    <!-- Fat and short -->
    <g transform="translate(10,70)" filter="url(#glow)">
      <rect x="10" y="0" width="120" height="12" rx="2" fill="#f59e0b" opacity="0.5"/>
      <rect x="5" y="16" width="130" height="12" rx="2" fill="#f59e0b" opacity="0.6"/>
      <rect x="0" y="32" width="140" height="12" rx="2" fill="#fbbf24" opacity="0.8"/>
      <rect x="0" y="48" width="140" height="12" rx="2" fill="#fbbf24" opacity="0.9"/>
      <rect x="0" y="64" width="140" height="12" rx="2" fill="#fbbf24"/>
      <rect x="0" y="80" width="140" height="12" rx="2" fill="#fbbf24" opacity="0.9"/>
      <rect x="5" y="96" width="130" height="12" rx="2" fill="#f59e0b" opacity="0.6"/>
      <rect x="10" y="112" width="120" height="12" rx="2" fill="#f59e0b" opacity="0.5"/>
    </g>
    <text x="80" y="225" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Wide, no direction</text>
  </g>
  <!-- Day Type 6: Neutral -->
  <g transform="translate(1010, 80)">
    <rect width="160" height="240" rx="14" fill="#1e293b" opacity="0.5" stroke="#38ef7d" stroke-width="1" stroke-opacity="0.3"/>
    <text x="80" y="30" fill="#38ef7d" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">Neutral Day</text>
    <!-- Compact symmetric -->
    <g transform="translate(25,55)" filter="url(#glow)">
      <rect x="25" y="0" width="60" height="12" rx="2" fill="#38ef7d" opacity="0.4"/>
      <rect x="15" y="16" width="80" height="12" rx="2" fill="#38ef7d" opacity="0.55"/>
      <rect x="5" y="32" width="100" height="12" rx="2" fill="#38ef7d" opacity="0.7"/>
      <rect x="0" y="48" width="110" height="12" rx="2" fill="#34d399" opacity="0.85"/>
      <rect x="0" y="64" width="110" height="12" rx="2" fill="#34d399"/>
      <rect x="0" y="80" width="110" height="12" rx="2" fill="#34d399" opacity="0.85"/>
      <rect x="5" y="96" width="100" height="12" rx="2" fill="#38ef7d" opacity="0.7"/>
      <rect x="15" y="112" width="80" height="12" rx="2" fill="#38ef7d" opacity="0.55"/>
      <rect x="25" y="128" width="60" height="12" rx="2" fill="#38ef7d" opacity="0.4"/>
    </g>
    <text x="80" y="225" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Equal tails, balanced</text>
  </g>
  <!-- Bottom labels -->
  <g fill="#475569" font-family="system-ui" font-size="10" text-anchor="middle">
    <text x="140" y="350">~20% of days</text><text x="330" y="350">~25% of days</text><text x="520" y="350">~15% of days</text>
    <text x="710" y="350">~10% of days</text><text x="900" y="350">~15% of days</text><text x="1090" y="350">~15% of days</text>
  </g>
  <!-- Tip at bottom -->
  <rect x="300" y="560" width="600" height="40" rx="10" fill="#1e293b" opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="600" y="585" fill="#94a3b8" font-family="system-ui" font-size="13" text-anchor="middle">Identify the day type by 10:15 AM → Trade accordingly the rest of the day</text>
</svg>
