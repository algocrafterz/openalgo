# ── Signal Engine Configuration ──────────────────────────
# User-configurable settings. Secrets go in .env instead.
# Keys marked [tune] are safe to adjust without breaking system logic.
# Keys without [tune] are calibrated to the execution model — change with care.

# ── Telegram ─────────────────────────────────────────────
# [tune] Add/remove channels freely. id = numeric chat ID or @username.
#
# `enabled` decides whether the engine SUBSCRIBES to a channel, i.e. whether trades are ever
# taken from it. Omit it and the channel is enabled — every pre-2026-09-06 config keeps
# working unchanged. A disabled channel is still listed, still parsed, and is named in the
# startup log as deliberately off.
#
# Prefer `enabled: false` over deleting or commenting out a block. A channel that is simply
# ABSENT is indistinguishable from one nobody remembered to add: BREAKOUT ran that way for
# its whole first fortnight — breakout.pine posting to intraday-breakout while this list held
# only smidestn and intraday-orb — and nothing in the file said it was on purpose.
telegram:
  # 2026-09-11: every strategy channel is now split ANALYZE/LIVE, and every id lives HERE and
  # ONLY here - config.yaml is the single source of truth for Telegram channel ids across the
  # whole engine (the two BreakingTrade-family .env chat-id vars this used to also need are
  # gone; only BREAKINGTRADE_BOT_TOKEN, an actual secret, remains in .env - see
  # signal_engine/analysis/breakingtrade/alerts.py's module docstring). For a PineScript
  # strategy (ORB, BREAKOUT) the id here must match whichever chat id that strategy's
  # TradingView alert is currently pointed at - that side is edited manually in TradingView,
  # never here. For a Python strategy (BreakingTrade family) alerts.py's chat_id_for() reads
  # the id straight from this list (or from breakingtrade_btst_channels below, for BTST) and
  # posts there automatically based on OpenAlgo's live analyze/live state - nothing to edit
  # anywhere when that flips.
  #
  # THE SAFETY GATE: a channel only ever trades when BOTH (1) this entry's `enabled: true`
  # AND (2) OpenAlgo is actually in that phase's mode. A `-live` entry stays `enabled: false`
  # until a strategy is deliberately promoted - flipping it is the one and only step that lets
  # that strategy touch real money, so do it last, not first.
  #
  # 2026-09-11: gate (2) IS NOW ENFORCED IN CODE. It was documented here from the day of the
  # split but never actually existed - listener._split_by_enabled() filtered on `enabled`
  # alone and nothing anywhere compared a channel's -analyze/-live suffix to the mode the
  # engine was running in. Flipping OpenAlgo to LIVE (exactly what promoting a strategy
  # requires) would have put all four enabled -analyze channels onto real money, silently.
  # listener._phase_mismatch() now refuses any message whose channel suffix disagrees with
  # OpenAlgo's current mode, PER MESSAGE (so a mid-session flip is caught too - subscriptions
  # are fixed once the client connects), logs it CRITICAL, records a DECLINED row, and alerts
  # once per channel. A channel with NO -analyze/-live suffix (smidestn) stays phase-agnostic.
  channels:
    - name: "smidestn"           # test channel
      id: -1002773559154
    # Stood down 2026-09-06 so BREAKOUT ran alone in LIVE mode - two live strategies sharing
    # 4 slots on Rs35k of real capital would have been one contaminated experiment, not two,
    # since whichever fired first took the margin and the other's rejections read like signal
    # quality. RE-ENABLED 2026-09-09 for the ANALYZE (paper) phase specifically: OpenAlgo's
    # sandbox has no such capital contention concern (mode_profiles.analyze below sizes
    # max_open_positions/max_trades_per_day for three strategies sharing the sandbox, exactly
    # like it already did for two), and the whole point of the paper phase is to observe all
    # three strategies' real signal flow side by side. Set back to false before ever flipping
    # OpenAlgo to live mode with more than one strategy enabled - the original contamination
    # reasoning still applies to real money.
    #
    # 2026-09-11: renamed -analyze (SAME id, SAME physical channel - this channel ran briefly
    # live before 2026-09-06, so its own scrollback has a few real fills mixed into what is now
    # paper history; the actual trade record lives in trades.db, not the channel, so this is
    # cosmetic only). New -live channel below for when ORB is next promoted.
    - name: "intraday-orb-analyze"
      id: -1003518225740
      enabled: true

    - name: "intraday-orb-live"
      id: -1004333530764
      enabled: false

    # PAPER TRADING from 2026-09-07, one week, reviewed EOD daily. The engine subscribes and
    # runs the FULL pipeline — validate, size, order, SL-M, staged TPs, tracker, time exit —
    # but OpenAlgo is in ANALYZE mode, so every order goes to the sandbox and no real money
    # moves. Nothing here needs changing to switch: the mode is read from OpenAlgo's
    # /api/v1/analyzer endpoint at runtime, NOT set in this file.
    #
    # This is a different and much better measurement than the fortnight before it, which was
    # breakout.pine talking to itself: sizing, risk gates, slot limits, the tracker and the
    # exit pipeline are all real now. What is still NOT measured is slippage — a sandbox fills
    # at the requested price. See breakout.md.
    #
    # 2026-09-11: renamed -analyze (SAME id - this channel ran LIVE-alone briefly around
    # 2026-09-06 before flipping to paper on 2026-09-07, so early scrollback predates the
    # paper phase; see the ORB note above on why that's cosmetic, not a data problem). New
    # -live channel below for when BREAKOUT is next promoted.
    - name: "intraday-breakout-analyze"
      id: -1004450500772
      enabled: true

    - name: "intraday-breakout-live"
      id: -1004357947389
      enabled: false

    # BreakingTrade scanner-selected intraday breakouts. Signals are emitted by
    # signal_engine/analysis/breakingtrade (not by a PineScript) in the same alert shape, so
    # the engine handles them with no special case: sizing, entry, SL-M, staged TPs, time exit.
    #
    # PAPER PHASE from 2026-09-07, one week. ENABLED so signal_engine takes every signal end
    # to end - sizing, entry, SL-M, staged TPs, time exit - but OpenAlgo must be in ANALYZE
    # mode, which routes the orders to the sandbox instead of the broker.
    #
    # THE SAFETY OF THIS WHOLE PHASE IS ONE SETTING. Enabled channel + live mode = real orders
    # on a strategy whose only scored sample is 5 signals, 2 correct. `--review` prints the
    # mode as its first line every day for exactly that reason; if it ever says anything but
    # analyze, set enabled back to false before anything else.
    #
    # 2026-09-10: split into a permanent ANALYZE channel (this one - unchanged id, so paper
    # history isn't lost, and this strategy has been paper-only since inception so nothing is
    # mixed in) and a LIVE channel below, so a strategy's paper chatter never sits next to its
    # real fills once promoted. alerts.py's chat_id_for() picks the destination automatically
    # from OpenAlgo's live analyze/live state.
    - name: "intraday-breakingtrade-analyze"
      id: -1004379472313
      enabled: true

    # LIVE counterpart of the channel above - flip enabled to true only when this strategy is
    # actually promoted (see the block comment at the top of `channels:` for the two-gate rule).
    - name: "intraday-breakingtrade-live"
      id: -1004437451627
      enabled: false

    # WATCHLIST outcome of the same scanner, kept on its OWN channel/strategy tag
    # (BREAKINGTRADE-WATCHLIST) rather than folded into intraday-breakingtrade above, on
    # purpose: "intraday-breakingtrade" only ever trades a CONFIRMED signal (trigger.py's
    # entry_trigger() has seen price close beyond the signal bar's extreme, which is what
    # made real signals rare - see entry_watch.py's 2026-09-09 fix). This channel trades the
    # WATCHLIST call itself, entered at the scan-hit price the moment it fires, with no
    # confirmation wait - see trigger.plan_trade_watchlist(). Same scanner, two different
    # entry philosophies, run side by side on separate risk slots so paper P&L answers which
    # one (if either) is worth taking live, without either strategy's losing streak throttling
    # the other via a shared daily-loss limit.
    #
    # PAPER PHASE from 2026-09-10, alongside intraday-breakingtrade. Enabled so the engine
    # takes every signal end to end - sizing, entry, SL-M, staged TPs, time exit - but
    # OpenAlgo must be in ANALYZE mode, exactly the same safety statement as above: enabled
    # channel + live mode = real orders on a strategy with ZERO scored samples yet.
    #
    # Same ANALYZE/LIVE split as intraday-breakingtrade above.
    - name: "intraday-breakingtrade-watchlist-analyze"
      id: -1003902599946
      enabled: true

    # LIVE counterpart - same two-gate rule as intraday-breakingtrade-live above.
    - name: "intraday-breakingtrade-watchlist-live"
      id: -1004467829402
      enabled: false

  # [tune] BTST (buy-today-sell-tomorrow) carry list from the same BreakingTrade scanner - see
  # alerts.py's alert_btst() docstring. Deliberately NOT part of `channels:` above: BTST is a
  # single actionable daily call a HUMAN decides on and places by hand before the 15:15
  # deadline (see strategy_cards.py's BTST card) - it is never auto-traded, so the engine's
  # listener has no reason to subscribe to it. It still gets the same ANALYZE/LIVE split and
  # the same pinned reference card as every other strategy - see listener.py's _connect().
  breakingtrade_btst_channels:
    analyze:
      name: "intraday-breakingtrade-btst-analyze"
      id: -1003917877015
    live:
      name: "intraday-breakingtrade-btst-live"
      id: -1003965775886

  # [tune] How much routine traffic reaches notify_channel.
  #   quiet   - outcomes only: fills, closes, time exits, the day summary
  #   normal  - the above plus order-placed / SL-placed / partial-exit steps  (default)
  #   verbose - everything, including "exit signal received" acknowledgements
  #
  # Failure events (rejections, SL failures, risk lockouts, orphans, engine start/stop) are
  # NEVER filtered at any level — trimming routine traffic is only worth doing because it
  # makes the exceptional traffic visible.
  #
  # `quiet` for the 2026-09-07 paper week: two strategies at up to 24 trades a day is ~120
  # messages at `normal`, which is where a failed SL goes unnoticed.
  notify_level: quiet

  # [tune] Personal/admin channel for start/stop/error alerts, order lifecycle, and the day
  # summary - same ANALYZE/LIVE split as the strategy channels above, so a risk-halt during
  # the paper phase never sits in the same channel as a real-money SL failure.
  # notifier.py picks the entry matching OpenAlgo's current mode; if the current phase's
  # entry is missing it falls back to whichever phase IS configured (see notifier.py's
  # _channel_for_phase()) so a safety alert is never silently dropped for a config gap. If
  # notify_channel has no entries at all, openalgoscheduler.py's broker-login notice falls
  # back to broadcasting on all signal channels instead - notifier.py's own sends do not.
  notify_channel:
    analyze:
      name: "signal-engine-analyze"
      id: -1003803150235
    live:
      name: "signal-engine-live"
      id: -1004361185376

# ── Position Sizing ──────────────────────────────────────
sizing:
  # CRITICAL: changing mode switches the entire sizing model.
  # fixed_fractional = risk_per_trade % of capital / SL distance (recommended)
  # pct_of_capital   = pct_of_capital % of capital regardless of SL
  mode: fixed_fractional

  # [tune] Fraction of capital to risk per trade (fixed_fractional mode).
  # 1% is conservative — Kelly fraction for this strategy is ~34%. Keep at 1% until ₹1L+.
  risk_per_trade: 0.01

  # [tune] Fraction of capital per trade (pct_of_capital mode only — unused when mode=fixed_fractional).
  pct_of_capital: 0.05

  # [tune] Entry price filter — reject signals outside this range. 0 = no filter.
  # Current range ₹150–₹800 targets liquid mid-caps with manageable qty sizes at ₹15K capital.
  # min raised 150 -> 300 on 2026-09-06 for slippage, not for edge. NSE tick is Rs0.05 on
  # every name in the sample (checked against symtoken, including IEX at Rs118). With a
  # ~0.30% stop the risk per share IS the price times 0.003, so ONE tick costs:
  #     IEX  Rs118.70 -> risk/share Rs0.35 -> 1 tick = 0.143R
  #     ITC  Rs264.65 -> risk/share Rs0.79 -> 1 tick = 0.063R
  #     SBIN Rs1035   -> risk/share Rs3.11 -> 1 tick = 0.016R
  # A MARKET entry plus a MARKET TP exit is two legs, so sub-Rs300 names spend 0.13-0.29R on
  # ticks alone against a slippage_factor budget of 0.10R. The calibration below is simply
  # untrue for them.
  #
  # max LEFT at 5000 deliberately. The same arithmetic says high-priced names are the CHEAPEST
  # to execute (MARUTI Rs12,884 -> 1 tick = 0.001R) and there is no affordability barrier at
  # Rs35k, so 5000 is an arbitrary exclusion of the best-executing part of the universe. It is
  # not raised today because widening the universe on day one of live trading adds variance
  # with no evidence behind it: in the 31 Aug - 04 Sep sample the three names above 5000
  # (DIVISLAB, MARUTI, BAJAJHLDNG) were ALL losers, which is n=3 and proves nothing either
  # way. Revisit after 2-3 live weeks.
  min_entry_price: 300
  max_entry_price: 5000

  # CRITICAL: calibrated to MARKET entry + MARKET TP exit (both legs slip).
  # 0.10 = 10% slippage buffer on risk_per_share. Do not reduce unless switching to LIMIT TP exits.
  slippage_factor: 0.10

  # [tune] SL distance cap for position sizing (as fraction of entry price). 0 = DISABLED.
  # WARNING: enabling this BREAKS the 1% risk-per-trade guarantee.
  # If SL fires on a capped signal the actual loss = qty × real_sl_distance, which can be
  # 2-3x risk_per_trade on wide-range ORB days (e.g. JSWENERGY 4.18% SL → 2.43% loss).
  # Keep at 0 to maintain strict ~0.9% actual risk per trade (validated: Q2 2026 trades
  # show 0.81-0.90% actual risk — slippage_factor=0.10 in the denominator is the ~10% buffer).
  # The lower capital utilisation on wide-SL days is the CORRECT consequence of 1% risk mgmt.
  max_sl_pct_for_sizing: 0.0

  # [tune] Capital override in analyze (sandbox) mode. Has no effect in live mode — live capital
  # is fetched from broker API.
  #
  # 2026-09-10: was 35000, mismatched against OpenAlgo's actual sandbox account, which has been
  # configured with starting_capital=100000 (db/sandbox.db's sandbox_config table) since it was
  # created 2025-12-29. Every paper trade since then was sized as if capital were 35k while the
  # real dummy account backing margin checks held ~80-100k - not a failure (undersizing is
  # safe), but every position was smaller than the capital actually being tested implied, and
  # the two numbers should agree. Raised to match.
  #
  # 2026-09-10 (later same day): PFC sized 909 qty off this value the first time it took effect
  # - correct per the formula (risk.py's day-start-capital cache means EVERY trade a strategy
  # takes today gets the same risk budget, not just the first one; the loss that followed was
  # one ordinary 1R stop-out, not a sizing bug).
  #
  # Also 2026-09-10: RiskEngine now caches day-start capital PER STRATEGY in ANALYZE mode
  # (risk.py) - each of the three sandbox strategies (ORB, BREAKOUT, BreakingTrade) gets its
  # OWN independent Rs100,000 (~Rs1L) sizing pool, sized and risk-limited completely
  # independently of what the other two are doing. This value has no effect in LIVE mode
  # either way (see the note above) - live capital always comes from the broker funds API,
  # and since 2026-09-10 (later same day) every live strategy POOLS into the same shared
  # day-start figure instead of each getting its own copy - see mode_profiles.live's note.
  sandbox_capital: 100000

  # [tune] Cache capital at first signal of the day; use same value for all trades.
  # Ensures equal risk per trade regardless of intra-day capital fluctuations from open positions.
  #
  # 2026-09-10: the cache itself is now per-strategy in ANALYZE, pooled across all strategies
  # in LIVE (RiskEngine._key) - this flag just turns the caching behaviour on/off, the same
  # either way; which counter it caches INTO differs by mode.
  use_day_start_capital: true

  # [tune] Hard cap on qty per order (0 = disabled). Set to 1 when testing pipeline live
  # with minimal exposure before going full size.
  test_qty_cap: 0

  # [tune] Minimum live capital (INR) to place a new entry.
  # When open positions consume most margin, live capital drops below this floor and new
  # entries are skipped cleanly — no scaled-down dwarf orders sent to broker.
  # At ₹35K: each slot uses ~₹10,937 margin; ₹5,000 floor ensures any scaled entry is
  # at least 46% of full size (₹161 min risk) — below this the order is not worth placing.
  min_capital_for_entry: 5000

# ── Risk Management ──────────────────────────────────────
risk:
  # [tune] Daily/weekly/monthly loss limits as fraction of capital. Engine locks out new entries
  # when the limit is hit. Resets automatically at the start of each period.
  #
  # WHAT EACH ONE MEASURES (2026-09-11 - these were not the same thing before, and the
  # difference decided whether the engine could trade past its first bad week):
  #
  #   daily   - GROSS realised loss: losing trades only, wins do NOT offset. This is a
  #             loss-streak gate, and it is deliberate - "4% = four full stops" below is
  #             exactly that reading. Four stop-outs is a signal about the DAY, whatever the
  #             winners did, so a net-positive day can still halt. That is the intent.
  #   weekly  - NET realised drawdown: wins offset losses.
  #   monthly - NET realised drawdown: wins offset losses.
  #
  # Weekly and monthly used to be gross too, which made them trade COUNTERS wearing the
  # costume of a drawdown percentage. At Rs 350 risk/trade on Rs 35k that was 8 losing trades
  # for the week and 15 for the month - at max_trades_per_day 10 and a ~50% loss rate, roughly
  # two sessions and four. The engine would have locked itself out for the rest of the week,
  # then the month, on an account that was making money. A month of 60 wins and 40 losses was
  # halted in week one. RiskEngine now tracks signed net P&L per period (risk.py's
  # _StrategyState.daily/weekly/monthly_net_pnl, persisted in risk.db's daily_net_pnl column)
  # and the weekly/monthly gates measure that.
  # RE-ARMED 2026-09-06 for the live BREAKOUT launch. These sat at 1.0 (i.e. disabled) for
  # paper testing, where there was nothing to protect. Going live with them off means a bad
  # day has no floor at all: max_trades_per_day is 10, so 10 full stops is a 10% account loss
  # with nothing stopping the eleventh.
  #
  # 4% daily = four full stops. The 31 Aug - 04 Sep sample's worst session (03 Sep) took four
  # -1R hits, so this limit WOULD have fired that day — which is the intent, not a flaw. Raise
  # it only on evidence that trades after a 4-loss day are worth taking.
  daily_loss_limit: 0.04
  weekly_loss_limit: 0.08
  monthly_loss_limit: 0.15

  # [tune] Max concurrent open positions.
  # Reduced 7 -> 4 (2026-05-12). Q1 data: signals 1-2 have 90% WR, signals 3+ drop to
  # 57% WR. On chop days (May 5, 7, 12) all 7 slots filled with correlated losers — more
  # positions amplified losses without edge. 4 slots capture the best morning breakouts
  # while limiting exposure when the market isn't following through.
  # Lowered 4 -> 2 on 2026-09-06. Kept at 2 for the 2026-09-07 paper week ON PURPOSE, even
  # though a sandbox could afford any number: the point of the week is to learn what the LIVE
  # configuration would have done, and a paper run with limits the live account cannot honour
  # produces numbers that do not transfer. Signals refused for a full slot are recorded as
  # DECLINED rows (db.save_declined) rather than vanishing, so the review can ask what the
  # refused ones would have been worth.
  #
  # This is arithmetic, not preference:
  # at 1% risk with a ~0.30% stop the notional per position is risk/(sl_pct x (1+slippage))
  # = ~3x capital, so at 20% MIS margin ONE position needs ~Rs21k of Rs35k — 60% of the
  # account. Measured across the 31 Aug - 04 Sep sample: median Rs21,123 per position, so 2
  # concurrent already needs 1.2x capital and the Margin API scales the second one down.
  # Slots 3 and 4 could never have been funded; leaving them at 4 just produced broker
  # rejections that read like signal quality. Raise this only as capital grows.
  max_open_positions: 2

  # [tune] Hard cap on total trades per day (slots can recycle within this limit).
  # 10 = 4 concurrent + 6 recycles. Proportional to max_open_positions reduction 7->4.
  max_trades_per_day: 10

  # [tune] Minimum reward:risk ratio to accept a signal.
  # ORB PineScript guarantees >= 0.8R (ORB-width TP, floor at 0.8R). 0.75 is a safety net
  # for parser edge cases only — no valid ORB signal should be rejected by this threshold.
  min_rr: 0.75

  # [tune] Suppress duplicate signals for the same strategy+symbol+direction+level within
  # this window.
  #
  # 2026-09-11: the STRATEGY is now genuinely part of that key. It was not, despite what this
  # comment already claimed - validator._check_duplicate() keyed on
  # (symbol, direction, tp_level or entry), and an EXIT synthesizes entry 0.0, so the key
  # reduced to (SYMBOL, "EXIT", "TP1"), shared by every strategy holding that name. Two
  # strategies hitting TP1 on the same stock within this window meant the second alert was
  # dropped as a duplicate and THAT POSITION NEVER EXITED - it rode to the 14:45 time exit.
  # BREAKINGTRADE / BREAKINGTRADE-WATCHLIST collide by design; ORB / BREAKOUT share the same
  # NSE universe and the same 5-min bars and can collide the same way.
  duplicate_window_seconds: 60

  # [tune] Reject signals with a timestamp older than this (catches stale Telegram deliveries).
  # 2026-09-11: a drop is now logged at WARNING and written to trades.db as a DECLINED row
  # (stage "channel_phase"). It used to be a DEBUG line and nothing else, so after the
  # 2026-09-08 Telegram outage there was no way at all to answer "what did we miss".
  stale_signal_seconds: 60

  # [tune] Reject SL tighter than this fraction of entry price (0 = disabled).
  # Override per strategy under strategy_profiles.<TAG>.min_sl_pct.
  #
  # THIS IS A LEVERAGE CAP, not a noise filter. Under fixed_fractional sizing the notional
  # exposure is  risk_per_trade / (sl_pct x (1 + slippage_factor))  — entry PRICE cancels out
  # entirely, so one value serves the whole 150–5000 band. Verified 2026-08-25 across
  # Rs 150 / 300 / 800 / 2000 / 5000: exposure is flat to within floor() rounding.
  #
  #   sl_pct   leverage at risk_per_trade 1%
  #   0.10%    9.09x   — beyond any MIS allowance; margin scaling will cut the order
  #   0.20%    4.55x   — BREAKOUT (key-level stops, 0.35 x ATR beyond the level)
  #   0.30%    3.03x
  #   0.50%    1.82x   — global default, matches ORB stop geometry
  #   1.00%    0.91x
  #
  # What it does NOT capture is how tight the stop is for THAT STOCK's volatility — 0.20% is
  # 0.4 ATR on a quiet name and 0.07 ATR on a volatile one. That dimension is enforced
  # upstream in breakout.pine (klSlBufferMult x ATR) and is now recorded per trade as
  # AtrPct / SlAtr in the alert context, for an evidence-based floor after ~30 days.
  #
  # Tick granularity does not bind inside the current band: 0.20% of Rs 150 is Rs 0.30, six
  # NSE ticks. It would only bite below Rs 125.
  min_sl_pct: 0.005

  # [tune] Max concurrent positions in the same symbol (0 = no limit).
  #
  # 2026-09-11: this follows the same LIVE-pools / ANALYZE-isolates split as every other
  # counter (risk.py's _key). It used to be global in both modes, which quietly broke the
  # BreakingTrade experiment: BREAKINGTRADE and BREAKINGTRADE-WATCHLIST are BUILT to hold
  # the same name at the same time so paper P&L can compare the two entry philosophies, and
  # the watchlist fires on the scan-hit poll - before plan_trade()'s confirming close exists
  # - so it always took the one symbol slot and the confirmed signal was declined "symbol
  # concentration limit". BREAKINGTRADE showing near-zero trades would have read as "the
  # confirmation filter is too strict" rather than "the cap blocked it". In LIVE it still
  # pools: two strategies in one real name is genuine correlated exposure.
  max_positions_per_symbol: 1

  # [tune] Max concurrent positions in the same sector (0 = disabled).
  # Disabled: stock universe spans the same sectors (FINANCE: PFC, JIOFIN, RECLTD etc.)
  # Same LIVE-pools / ANALYZE-isolates split as max_positions_per_symbol above.
  max_positions_per_sector: 0

# ── Symbol Blacklist ─────────────────────────────────────
# [tune] Review monthly using SIGNAL-PERFORMANCE-*.md. Add D-grade symbols (WR < 35%, PnL < -0.5%).
# _global applies to ALL strategies. Strategy-specific keys by strategy tag (ORB, RSI-TP-MR, etc.)
#
# Two tiers per strategy (since 2026-04-25):
#   hard: full block — validator rejects signal at IGNORED status (no order placed)
#   soft: regime-sensitive — order is placed but qty is scaled by soft_multiplier
#         use for Q1->Q2 grade flips where the symbol may recover; full block discards
#         optionality, half-size keeps participation while limiting downside.
#
# Backward compat: a flat list under a strategy key (e.g. RSI-TP-MR) is treated as hard-only.
blacklist:
  _global:
    - YESBANK            # Erratic price action, manipulation risk
  ORB:
    hard:
      - BHEL             # 0% WR across Q1+Q2 2026; false breakout 2026-05-12 (-0.8R)
    soft: []
    soft_multiplier: 0.5 # 50% qty for soft-listed symbols. 0 = effectively hard-block.
  BREAKINGTRADE:
    # Scanner-selected names change daily, so a per-symbol blacklist is less useful here than
    # for the fixed-universe strategies. YESBANK is already blocked globally.
    hard: []
    soft: []
    soft_multiplier: 0.5

  BREAKINGTRADE-WATCHLIST:
    # Same scanner, same daily-changing universe as BREAKINGTRADE above - same reasoning.
    hard: []
    soft: []
    soft_multiplier: 0.5

  BREAKOUT:
    # The validator keys strictly on the strategy tag, so ORB's list does NOT carry over.
    # BHEL is repeated here for the reason it is blocked for ORB: 0% WR across Q1+Q2 2026.
    # Both tags trade the same NSE universe on the same 5-min bars, so a symbol that cannot
    # hold a break for one will not hold it for the other.
    hard:
      - BHEL
    soft: []
    soft_multiplier: 0.5
  EMA9:
    hard: []             # No history yet. Review monthly from the trade log, same as ORB.
    soft: []
    soft_multiplier: 0.5
  EMA9VWAP:
    hard: []             # No history yet. Review monthly from the trade log, same as ORB.
    soft: []
    soft_multiplier: 0.5


# ── Time Exit ────────────────────────────────────────────
# [tune] Close all open positions before broker auto square-off (typically 15:10-15:20 IST).
# Penalty for broker-forced square-off is Rs 20-50/order.
time_exit:
  enabled: true
  hour: 14                       # IST hour (24h format)
  minute: 45                     # 14:45 — moved earlier from 15:00 (2026-08-25). Wider buffer
                                 # before the 15:10 broker auto square-off, and it clears the
                                 # last-half-hour spread widening. Keep breakout.pine's
                                 # timeExitHour/Minute inputs in step with this.

# ── No-progress Detection ────────────────────────────────
# [tune] Move SL to break-even (or exit at market) when a trade hasn't progressed toward TP1.
# Protects capital on "stuck" positions without waiting for the 15:00 time exit.
# After check_after_minutes, if ltp has NOT moved min_progress_pct of the entry→TP1 distance:
#   - Project time needed to reach TP1 at current rate: minutes_needed = (1 - progress) / rate
#   - If minutes_needed > minutes_to_exit  -> MARKET EXIT (won't make it, capture what exists)
#   - Otherwise                            -> break-even SL (position still has runway)
#
# Loosened 2026-04-25: was 60min/33%. Apr 13–24 logs showed ~17 firings/week with
# JSWENERGY/EXIDEIND/NATIONALUM cut at 31.2%/31.7%/31.1% — 1–2% short of threshold and
# 1–2% short of TP1 itself. 90min/20% gives genuinely-stuck trades a wider lane to resolve.
no_progress:
  enabled: true
  check_after_minutes: 90        # Was 60. Most ORB trades resolve within 90–150min; 60 was cutting winners
  min_progress_pct: 0.20         # Was 0.33. 20% is the minimum to qualify as "real progress"
  profit_lock_ratio: 0.0         # 0.0 = strict break-even for SL path (recommended)
  ab_test_disable: false         # When true, disables the entire no-progress check. Use for A/B comparison.

  # Optional EARLY no-progress gate. Independent of the main gate above — fires
  # at a much lower threshold to catch "going nowhere" trades and free the slot
  # before the 90min main check. Same exit logic as main gate (market-exit if
  # the trade can't reach TP before time-exit; break-even SL otherwise).
  #
  # Defaults are conservative: 45min / 5% only catches genuinely catastrophic
  # stalls (≤ 5% of the way to TP after 45 min). It does NOT replace the main
  # gate — both gates run; whichever fires first wins.
  #
  # 2026-05-04 OIL example: at 45min OIL had moved ~8% toward TP — would NOT
  # have fired this gate (threshold is 5%). At ~70-80min it was ~13%, would
  # have caught it earlier than the 97min main gate.
  #
  # Tune ranges for the operator:
  #   - early_check_after_minutes: 30–60 (sweet spot 45)
  #   - early_min_progress_pct:    0.03–0.10 (sweet spot 0.05)
  # 2026-05-07: disabled. Early gate was force-exiting trades at small adverse
  # drift (e.g. TATASTEEL -24%, VOLTAS -8%) before the broker SL had any chance
  # to fire — adding market-order slippage on top of an unrealised loss.
  # On 2026-05-07 4/4 trades hit early gate; TATASTEEL slipped -1.5R past SL.
  # Keep only the main gate (90min/20%) to catch truly stuck trades.
  early_check_enabled: false
  early_check_after_minutes: 45
  early_min_progress_pct: 0.05

  # Adaptive chop tightener: shorten the EARLY gate after the day shows clear chop
  # signs (multiple stalled trades). Self-resets each session along with day counters.
  # Main gate is intentionally NOT tightened — it protects slow-developing winners
  # (e.g., 2026-05-05 PETRONET reached TP-territory at 127min on the 90/20% main gate).
  #
  # Trigger: count of no-progress firings today (across early + main gates) reaches
  # `chop_tightener_trigger_count`. From that point, early gate uses the tightened
  # `chop_tightener_early_check_after_minutes` instead of `early_check_after_minutes`.
  #
  # Empirical justification (Apr 20–May 5):
  #   - 4/10 days had ≥2 no-progress exits (Apr 22, 24, 30, May 4, May 5)
  #   - On 2026-05-05, 7/8 filled positions hit no-progress; first 2 fired at 10:45/10:50.
  #     A tightened 30-min gate would have force-exited 4 in-flight stalled trades
  #     ~15 min earlier and freed capital sooner. Main gate would still have caught
  #     PETRONET's eventual recovery.
  #
  # Conservative defaults: trigger=2 (avoids 1-trade noise), tightened=30min.
  # 2026-05-07: disabled. Tightener only shortens the early gate, which is now off.
  chop_tightener_enabled: false
  chop_tightener_trigger_count: 2
  chop_tightener_early_check_after_minutes: 30

  # Loss-cut gate: exit immediately when progress is deeply negative (price running hard
  # against the position), regardless of age — subject to loss_cut_min_age_minutes.
  # At 1:1 R:R, progress=-1.0 ≈ at-SL from fill. -0.80 = 80% of the way to SL.
  # Today's example: BHEL -121% at 90min (would have fired much earlier at -80%).
  # Set min_age_minutes to skip opening-candle noise (20 min recommended).
  loss_cut_enabled: true
  loss_cut_min_age_minutes: 20        # don't fire in first N min after entry
  loss_cut_progress_threshold: -0.80  # fire when progress < -80% (deep loss, heading to SL)

  # Use actual broker fill_price (not signal entry) when computing progress.
  # Recommended true — keeps the metric aligned with what the trade actually risks.
  # Set false to revert to legacy signal-entry-based progress (less accurate).
  use_fill_price_for_progress: true

# ── Position Tracking ────────────────────────────────────
tracking:
  # [tune] Seconds between position checks. Detects broker SL-M fills (qty drops to 0).
  # 5s halves slot-recovery latency vs 10s — 1 API call per poll, negligible load.
  poll_interval: 5

  # [tune] Minimum age (seconds) before a position can be detected as closed.
  # Protects against ghost-closes: when an order is rejected/slow-to-fill, the position
  # briefly shows qty=0 in positionbook before the broker processes the fill.
  # 30s covers the worst-case positionbook propagation lag while still catching real SL hits.
  min_position_age_seconds: 30
  guard2_timeout_minutes: 30     # Max wait for ambiguous entry-order status before assuming complete

# ── Broker / Exchange ────────────────────────────────────
broker:
  # CRITICAL: must match your broker account setup. Changing exchange affects margin estimation.
  exchange: NSE
  product: MIS                   # MIS (intraday, 5x leverage) or CNC (delivery, 1x)
  order_type: MARKET             # MARKET (recommended) or LIMIT — affects slippage_factor calibration

  # [tune] Testing only: place CNC orders in analyze mode outside market hours.
  # Bypasses sandbox MIS restriction without touching live capital. Keep false in production.
  allow_off_hours_testing: false

  # CRITICAL: must match your broker's actual NSE equity MIS margin percentage.
  # Flattrade = 20% (5x leverage). Used to estimate whether full-risk qty fits in live capital.
  # If wrong, margin floor check will either reject valid trades or allow broker rejections.
  mis_margin_pct: 0.20

# ── Broker Restrictions ──────────────────────────────────
# [tune] Symbols the broker is known to reject for a given product, regardless of capital.
# The engine skips these before placing the order — saves a wasted slot, a rejected order
# in the broker book, and the back-and-forth Telegram noise.
#
# Categories (NSE/BSE equity MIS):
#   • T2T (BE series)        — handled separately via _is_be_series() symtoken lookup
#   • GSM Stage 1+           — Graded Surveillance Measure, MIS not allowed
#   • ASM Stage IV+          — Additional Surveillance Measure, no leverage
#   • Stock-specific overrides — broker won't offer MIS leverage on these even outside surveillance
#
# Maintenance: append a symbol here when "Order Rejected: <reason>" appears in the engine
# log for that symbol consistently across days. See FLATTRADE-RESTRICTIONS.md for the
# full procedure and current categorisation.
broker_restrictions:
  flattrade:
    # Stocks Flattrade rejects for MIS regardless of capital. UPPERCASE only.
    mis_rejected: [APOLLOTYRE]

# ── Listener ─────────────────────────────────────────────
listener:
  # [tune] Telegram reconnection settings. Increase max_retries for unreliable connections.
  max_retries: 5                 # Max reconnection attempts before giving up
  base_backoff: 2                # Base seconds for exponential backoff between retries

# ── API ──────────────────────────────────────────────────
api:
  # [tune] HTTP timeout and retry settings for OpenAlgo API calls.
  timeout: 5.0                   # Request timeout in seconds
  margin_retries: 3              # Retries for Margin API on network error (not on app errors)

# ── Bracket Orders ────────────────────────────────────────
bracket:
  # CRITICAL: disabling removes all broker-side SL protection. Keep enabled=true in production.
  enabled: true

  # CRITICAL: CNC SL-M orders are cancelled at EOD by NSE — no overnight protection.
  # GTT not supported by OpenAlgo. CNC exits are driven by TradingView EXIT signals only.
  cnc_sl_enabled: false

  # CRITICAL: SL-M (market) is safer than SL (limit) — always fills on gap-down.
  # Only change to SL if your broker doesn't support SL-M.
  sl_order_type: SL-M

  # [tune] SL placement retry settings. Safety-critical — 5 retries × 0.5s = 2.5s window.
  max_sl_retries: 5
  retry_delay: 0.5               # Seconds between SL placement retries

  # [tune] Retry count for TP market exit orders. 3 retries covers brief network glitches.
  tp_exit_retries: 3

  # [tune] Buffer below TP1 for runner SL after partial exit, as fraction of R (0.3 = 30% of R).
  # Prevents stop-out from TP1 wick-backs before price continues to TP1.5.
  # At avg SL=0.64%: ₹150 stock = 6 ticks, ₹500 stock = 18 ticks, ₹800 stock = 30 ticks.
  # 0.3R rationale: TP1 is at ~0.65R; buffer places SL at ~0.35R above entry (still profitable
  # if stopped). TP1.5 is 0.85R further up — gives price room to test TP1 before continuing.
  # 0.1 was too tight (TMPV 2026-04-13: ₹0.80 gap triggered by normal TP1 wick).
  # Set to 0.0 to place SL exactly at TP1.
  tp1_runner_sl_buffer: 0.3

  # [tune] Extended runner tiers: gates the runner-SL ratchet in main.py's
  # _replace_runner_sl(). When a strategy's TP2 becomes a partial exit (see breakout.pine's
  # useExtendedRunnerTiers input — keep this in lockstep with that), the runner SL anchors
  # to whichever TP level was just hit (TP1 -> TP1.5 -> TP2) instead of always TP1, and
  # only ever tightens, never loosens, versus the SL already in place.
  # false = pre-2026-09-06 behaviour: runner SL always anchors to TP1 - buffer x R.
  # Flip both this and breakout.pine's useExtendedRunnerTiers together to opt in or revert.
  #
  # Enabled 2026-09-06 (see breakout.md, "Week-1 forward review"). The 31 Aug - 04 Sep sample
  # ran with this off and produced two RUNNER observations at 4.50R unbooked each (RADICO,
  # HAVELLS) — moves the position had already closed out of at TP2. Re-scoring that week's
  # printed alert prices under 30/35/35 gives +6.62R against the +4.31R actually booked, with
  # no change to which trades were taken and no change to risk per trade.
  use_extended_runner_tiers: true

# ── Mode Profiles ────────────────────────────────────────
# [tune] Risk limits that differ between paper and live. The engine asks OpenAlgo which mode
# it is in at startup (/api/v1/analyzer) and layers the matching profile over the `risk:` and
# `sizing:` values above. Keys absent from a profile keep their base value.
#
# WHY BOTH MODES ARE LISTED even though `live` mostly repeats the base config: a profile for
# only one mode is exactly the confusing state this exists to remove. Reading `live:` here
# should never require also remembering what `risk:` said.
#
# An unknown mode name falls through to the base values rather than guessing — a typo must
# never hand a live account the paper limits.
mode_profiles:

  # Real money. These are the numbers derived on 2026-09-06: one position needs ~60% of a
  # Rs35k account at 20% MIS margin, so 2 concurrent is the ceiling; 4% daily is four full
  # stops; the Rs300 price floor keeps one tick under ~0.05R.
  #
  # 2026-09-10: RiskEngine.isolates_per_strategy is False for any mode other than "analyze"
  # (risk.py), so in LIVE mode every one of these five numbers is a POOLED total shared by
  # ALL enabled live strategies, not a per-strategy allowance. There is one real broker
  # account, so max_open_positions=2 means 2 TOTAL across every live strategy combined, and
  # a loss in any one of them counts against the same daily/weekly/monthly ceiling as every
  # other. Same day-start capital number too (sizing.sandbox_capital's per-strategy note is
  # ANALYZE-only) — a strategy sizing a trade after another already holds a position checks
  # what OpenAlgo's funds API says is ACTUALLY left, not a second imaginary full account.
  # Currently moot (only BREAKOUT is enabled live), but this is what makes it safe to ever
  # enable a second live strategy without re-deriving these numbers from scratch.
  live:
    max_open_positions: 2
    max_trades_per_day: 10
    daily_loss_limit: 0.04
    weekly_loss_limit: 0.08
    monthly_loss_limit: 0.15
    min_entry_price: 300
    max_entry_price: 5000

  # Paper (OpenAlgo ANALYZE). Deliberately LOOSER than live, which reverses the earlier
  # instinct to mirror live limits exactly. The reason is that declines are now recorded
  # (db.save_declined): with loose limits every signal is taken, so the OUTCOME of a signal
  # live would have refused is observable, and "would the 4% daily limit have fired?" can be
  # replayed offline from the ledger. With tight limits those outcomes are simply never
  # generated and no amount of later analysis recovers them. Loose paper limits are strictly
  # more information, not less discipline.
  #
  # Sized for THREE strategies sharing the sandbox (intraday-breakout + intraday-orb +
  # intraday-breakingtrade, since 2026-09-09) so none starves the others of slots.
  #
  # 2026-09-10: these numbers used to be a SHARED TOTAL (9 = "3 slots/strategy x 3
  # strategies", 36 the equivalent trades/day) enforced by one global counter — so in
  # practice whichever strategy fired most could still eat the other two's slots, exactly
  # the contention this profile exists to avoid. RiskEngine now tracks open_positions and
  # trades_today PER STRATEGY (risk.py), briefly fixed at a per-strategy 3/12.
  #
  # 2026-09-10 (later same day): removed entirely. User wants the paper-trading dataset as
  # large as possible ("more trades = better dataset for testing"), and an artificial slot
  # cap is exactly what throws signals away instead of recording them — declined entries do
  # get logged (db.save_declined) but a cap-driven decline tells you nothing about the
  # STRATEGY, only about capacity, which paper trading has no reason to ration (there is no
  # real capital being protected — see sizing.sandbox_capital's per-strategy note above).
  # 0 = unlimited, same convention risk.max_positions_per_symbol/sector already use — each
  # strategy now takes every signal its own rules pass, with no artificial ceiling. No
  # capital increase needed to support this: sizing uses each strategy's cached day-start
  # capital for every trade regardless of how many are open (see sandbox_capital comment),
  # so 1 trade or 50 that day all size identically off the same Rs1L.
  #
  # Loss limits at 1.0 = off. There is no capital to protect and a mid-week lockout would
  # truncate the observation. The live profile above is what protects the account.
  analyze:
    max_open_positions: 0
    max_trades_per_day: 0
    daily_loss_limit: 1.0
    weekly_loss_limit: 1.0
    monthly_loss_limit: 1.0
    min_entry_price: 300
    max_entry_price: 5000

# ── Strategy Profiles ───────────────────────────────────────
# [tune] Per-strategy TP exit fractions, product type and stop-distance floor.
# tp_levels:  TP label -> fraction of position to exit at that level (e.g. TP1: 0.5 = exit 50%).
# product:    overrides broker.product for this strategy (MIS or CNC).
# min_sl_pct: overrides risk.min_sl_pct for this strategy. Omit to inherit the global floor;
#             0.0 disables the check for this strategy only.
# If a strategy is absent here, every TP HIT exits 100% of position.
strategy_profiles:
  ORB:
    product: MIS
    # tp_levels absent — ORB PineScript sends ExitQtyPct in each TP HIT alert.
    # Engine reads ExitQtyPct directly; strategy owns exit fractions, not this config.
  BREAKOUT:
    product: MIS
    # tp_levels absent — breakout.pine sends ExitQtyPct in each TP HIT alert.
    #
    # [tune] 0.20% vs the global 0.50%. Key-level stops sit klSlBufferMult (0.35) x ATR beyond
    # the triggering level, several times tighter than ORB stops, so the ORB-calibrated floor
    # rejected ALL SEVEN signals on 2026-08-24 (stops 0.247%-0.342%).
    # 0.20% sits ~19% below the tightest observed stop, which keeps the headroom without
    # admitting noise: on a Rs 300 stock it is Rs 0.60, still several ticks wide.
    # Do NOT raise to 0.25% — that rejects VEDL at 0.2465%, the best trade of the day (+4.57R).
    min_sl_pct: 0.002
  EMA9VWAP:
    product: MIS
    # tp_levels absent — ema9-vwap.pine sends ExitQtyPct (100) in its TP1 HIT alert.
    #
    # NOT VALIDATED AS PROFITABLE. Measured at -0.41 bps gross out-of-sample against a
    # ~10 bps cost line over 11,815 trades, and the crossover itself follows through LESS
    # often than a coin flip (44.5% at 0.5 ATR, t = -18.76, n = 29,492). The profile exists
    # so the script can run through the real pipeline and log its own signals; keep the
    # symbol blacklist or sandbox mode in front of it until forward data says otherwise.
    # See signal_engine/pinescripts/intraday/ema9-vwap/STRATEGY-LOG.md.
    #
    # min_sl_pct 0.20%, matching BREAKOUT/EMA9 rather than the 0.50% global. The stop is the
    # recent swing extreme plus a 0.10 x ATR buffer; the measured median across the backtest
    # was 0.64% of price, but the tighter tail sits well inside 0.50% and the 0.20% floor is
    # what the backtest itself modelled, so the two agree.
    min_sl_pct: 0.002
  EMA9:
    product: MIS
    # tp_levels absent — ema9-intraday.pine sends ExitQtyPct (100) in its TP1 HIT alert.
    # The strategy owns its exit fractions, not this config.
    #
    # min_sl_pct 0.20%, same as BREAKOUT rather than the 0.50% global. The 9 EMA stop is
    # anchored on the pullback swing plus a 0.35 x ATR buffer and is forced past the 9 EMA
    # itself, so it lands in the same tight band as the key-level stops — the ORB-calibrated
    # 0.50% floor would reject most valid signals outright.
    min_sl_pct: 0.002
  BREAKINGTRADE:
    product: MIS
    # tp_levels absent — alert_trade_signal() sends a single flat TP (trigger.py's staged
    # target ladder is computed but not yet wired through), so every TP HIT exits 100%.
    #
    # min_sl_pct 0.20%, same reasoning as BREAKOUT/EMA9 above rather than the 0.50% global:
    # trigger.stop_level() places the stop just beyond the scanner's own defended level
    # (tail_level) plus a 0.25 x ATR buffer - the same "beyond a specific level" style as
    # BREAKOUT's key-level stops, not ORB's wider IB-extreme stops. No BreakingTrade signal has
    # reached validation yet to measure its real stop distances (unlike BREAKOUT/EMA9, which
    # were tuned against actual rejected trades), so this is the closest evidence-based analog
    # available rather than a measured value - revisit once real signals accumulate.
    min_sl_pct: 0.002
    # No price band: unlike ORB/BREAKOUT/EMA9, BreakingTrade is not a fixed universe with its
    # own execution-cost calibration behind the global 300-5000 band - it scans the whole NSE
    # F&O list daily. Inheriting that band silently declined real candidates (MARUTI ~12,694,
    # PERSISTENT ~5,575, GMRAIRPORT ~98, VMM ~104 all seen in one day - 2026-09-07) with nobody
    # having decided that was wanted. 0 = no filter, so every scan match can be analysed.
    min_entry_price: 0
    max_entry_price: 0
  BREAKINGTRADE-WATCHLIST:
    product: MIS
    # tp_levels absent - alert_trade_signal() sends a single flat TP, same as BREAKINGTRADE.
    #
    # Same min_sl_pct/price-band reasoning as BREAKINGTRADE directly above: identical
    # trigger.stop_level() math (just fed the scan-hit price as entry instead of a confirmed
    # close - see trigger.plan_trade_watchlist()), same daily-changing NSE F&O universe.
    min_sl_pct: 0.002
    min_entry_price: 0
    max_entry_price: 0
  RSI-TP-MR:
    product: MIS
    tp_levels:
      TP1: 1.0                   # Exit 100% at TP1 (single TP for RSI mean reversion)
