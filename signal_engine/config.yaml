# ── Signal Engine Configuration ──────────────────────────
# User-configurable settings. Secrets go in .env instead.
# Keys marked [tune] are safe to adjust without breaking system logic.
# Keys without [tune] are calibrated to the execution model — change with care.

# ── Telegram ─────────────────────────────────────────────
# [tune] Add/remove channels freely. id = numeric chat ID or @username.
telegram:
  channels:
    - name: "smidestn"           # test channel
      id: -1002773559154
    - name: "intraday-orb"
      id: -1003518225740

  # [tune] Personal/admin channel for engine start/stop/error alerts.
  # If omitted, notifications go to all signal channels.
  notify_channel:
    name: "signal-engine"
    id: -1003803150235

# ── Position Sizing ──────────────────────────────────────
sizing:
  # CRITICAL: changing mode switches the entire sizing model.
  # fixed_fractional = risk_per_trade % of capital / SL distance (recommended)
  # pct_of_capital   = pct_of_capital % of capital regardless of SL
  mode: fixed_fractional

  # [tune] Fraction of capital to risk per trade (fixed_fractional mode).
  # 1% is conservative — Kelly fraction for this strategy is ~34%. Keep at 1% until ₹1L+.
  risk_per_trade: 0.01

  # [tune] Fraction of capital per trade (pct_of_capital mode only — unused when mode=fixed_fractional).
  pct_of_capital: 0.05

  # [tune] Entry price filter — reject signals outside this range. 0 = no filter.
  # Current range ₹150–₹800 targets liquid mid-caps with manageable qty sizes at ₹15K capital.
  min_entry_price: 150
  max_entry_price: 800

  # CRITICAL: calibrated to MARKET entry + MARKET TP exit (both legs slip).
  # 0.10 = 10% slippage buffer on risk_per_share. Do not reduce unless switching to LIMIT TP exits.
  slippage_factor: 0.10

  # [tune] SL distance cap for position sizing (as fraction of entry price). 0 = DISABLED.
  # WARNING: enabling this BREAKS the 1% risk-per-trade guarantee.
  # If SL fires on a capped signal the actual loss = qty × real_sl_distance, which can be
  # 2-3x risk_per_trade on wide-range ORB days (e.g. JSWENERGY 4.18% SL → 2.43% loss).
  # Keep at 0 to maintain strict ~0.9% actual risk per trade (validated: Q2 2026 trades
  # show 0.81-0.90% actual risk — slippage_factor=0.10 in the denominator is the ~10% buffer).
  # The lower capital utilisation on wide-SL days is the CORRECT consequence of 1% risk mgmt.
  max_sl_pct_for_sizing: 0.0

  # [tune] Capital override in analyze (sandbox) mode. Set to match live capital for realistic sizing.
  # Has no effect in live mode — live capital is fetched from broker API.
  sandbox_capital: 35000

  # [tune] Cache capital at first signal of the day; use same value for all trades.
  # Ensures equal risk per trade regardless of intra-day capital fluctuations from open positions.
  use_day_start_capital: true

  # [tune] Hard cap on qty per order (0 = disabled). Set to 1 when testing pipeline live
  # with minimal exposure before going full size.
  test_qty_cap: 0

  # [tune] Minimum live capital (INR) to place a new entry.
  # When open positions consume most margin, live capital drops below this floor and new
  # entries are skipped cleanly — no scaled-down dwarf orders sent to broker.
  # At ₹35K: each slot uses ~₹10,937 margin; ₹5,000 floor ensures any scaled entry is
  # at least 46% of full size (₹161 min risk) — below this the order is not worth placing.
  min_capital_for_entry: 5000

# ── Risk Management ──────────────────────────────────────
risk:
  # [tune] Daily/weekly/monthly loss limits as fraction of capital. Engine locks out new entries
  # when cumulative loss hits the limit. Resets automatically at the start of each period.
  daily_loss_limit: 0.04         # 4% = 4 losers at 1% risk before lockout
  weekly_loss_limit: 0.08        # 8% = 2 bad days per week
  monthly_loss_limit: 0.10       # 10% of capital

  # [tune] Max concurrent open positions.
  # Reduced 7 -> 4 (2026-05-12). Q1 data: signals 1-2 have 90% WR, signals 3+ drop to
  # 57% WR. On chop days (May 5, 7, 12) all 7 slots filled with correlated losers — more
  # positions amplified losses without edge. 4 slots capture the best morning breakouts
  # while limiting exposure when the market isn't following through.
  max_open_positions: 4

  # [tune] Hard cap on total trades per day (slots can recycle within this limit).
  # 10 = 4 concurrent + 6 recycles. Proportional to max_open_positions reduction 7->4.
  max_trades_per_day: 10

  # [tune] Minimum reward:risk ratio to accept a signal.
  # ORB PineScript guarantees >= 0.8R (ORB-width TP, floor at 0.8R). 0.75 is a safety net
  # for parser edge cases only — no valid ORB signal should be rejected by this threshold.
  min_rr: 0.75

  # [tune] Suppress duplicate signals for the same symbol+strategy within this window.
  duplicate_window_seconds: 60

  # [tune] Reject signals with a timestamp older than this (catches stale Telegram deliveries).
  stale_signal_seconds: 60

  # [tune] Reject SL tighter than this fraction of entry price (0 = disabled).
  # 0.5% filters noise — avoids trades where SL is within normal bid-ask spread.
  min_sl_pct: 0.005

  # [tune] Max concurrent positions in the same symbol (0 = no limit).
  max_positions_per_symbol: 1

  # [tune] Max concurrent positions in the same sector (0 = disabled).
  # Disabled: stock universe spans the same sectors (FINANCE: PFC, JIOFIN, RECLTD etc.)
  max_positions_per_sector: 0

# ── Symbol Blacklist ─────────────────────────────────────
# [tune] Review monthly using SIGNAL-PERFORMANCE-*.md. Add D-grade symbols (WR < 35%, PnL < -0.5%).
# _global applies to ALL strategies. Strategy-specific keys by strategy tag (ORB, RSI-TP-MR, etc.)
#
# Two tiers per strategy (since 2026-04-25):
#   hard: full block — validator rejects signal at IGNORED status (no order placed)
#   soft: regime-sensitive — order is placed but qty is scaled by soft_multiplier
#         use for Q1->Q2 grade flips where the symbol may recover; full block discards
#         optionality, half-size keeps participation while limiting downside.
#
# Backward compat: a flat list under a strategy key (e.g. RSI-TP-MR) is treated as hard-only.
blacklist:
  _global:
    - YESBANK            # Erratic price action, manipulation risk
  ORB:
    hard:
      - BHEL             # 0% WR across Q1+Q2 2026; false breakout 2026-05-12 (-0.8R)
    soft: []
    soft_multiplier: 0.5 # 50% qty for soft-listed symbols. 0 = effectively hard-block.

# ── Time Exit ────────────────────────────────────────────
# [tune] Close all open positions before broker auto square-off (typically 15:10-15:20 IST).
# Penalty for broker-forced square-off is Rs 20-50/order.
time_exit:
  enabled: true
  hour: 15                       # IST hour (24h format)
  minute: 0                      # 15:00 gives 10-min buffer before 15:10 broker auto square-off

# ── No-progress Detection ────────────────────────────────
# [tune] Move SL to break-even (or exit at market) when a trade hasn't progressed toward TP1.
# Protects capital on "stuck" positions without waiting for the 15:00 time exit.
# After check_after_minutes, if ltp has NOT moved min_progress_pct of the entry→TP1 distance:
#   - Project time needed to reach TP1 at current rate: minutes_needed = (1 - progress) / rate
#   - If minutes_needed > minutes_to_exit  -> MARKET EXIT (won't make it, capture what exists)
#   - Otherwise                            -> break-even SL (position still has runway)
#
# Loosened 2026-04-25: was 60min/33%. Apr 13–24 logs showed ~17 firings/week with
# JSWENERGY/EXIDEIND/NATIONALUM cut at 31.2%/31.7%/31.1% — 1–2% short of threshold and
# 1–2% short of TP1 itself. 90min/20% gives genuinely-stuck trades a wider lane to resolve.
no_progress:
  enabled: true
  check_after_minutes: 90        # Was 60. Most ORB trades resolve within 90–150min; 60 was cutting winners
  min_progress_pct: 0.20         # Was 0.33. 20% is the minimum to qualify as "real progress"
  profit_lock_ratio: 0.0         # 0.0 = strict break-even for SL path (recommended)
  ab_test_disable: false         # When true, disables the entire no-progress check. Use for A/B comparison.

  # Optional EARLY no-progress gate. Independent of the main gate above — fires
  # at a much lower threshold to catch "going nowhere" trades and free the slot
  # before the 90min main check. Same exit logic as main gate (market-exit if
  # the trade can't reach TP before time-exit; break-even SL otherwise).
  #
  # Defaults are conservative: 45min / 5% only catches genuinely catastrophic
  # stalls (≤ 5% of the way to TP after 45 min). It does NOT replace the main
  # gate — both gates run; whichever fires first wins.
  #
  # 2026-05-04 OIL example: at 45min OIL had moved ~8% toward TP — would NOT
  # have fired this gate (threshold is 5%). At ~70-80min it was ~13%, would
  # have caught it earlier than the 97min main gate.
  #
  # Tune ranges for the operator:
  #   - early_check_after_minutes: 30–60 (sweet spot 45)
  #   - early_min_progress_pct:    0.03–0.10 (sweet spot 0.05)
  # 2026-05-07: disabled. Early gate was force-exiting trades at small adverse
  # drift (e.g. TATASTEEL -24%, VOLTAS -8%) before the broker SL had any chance
  # to fire — adding market-order slippage on top of an unrealised loss.
  # On 2026-05-07 4/4 trades hit early gate; TATASTEEL slipped -1.5R past SL.
  # Keep only the main gate (90min/20%) to catch truly stuck trades.
  early_check_enabled: false
  early_check_after_minutes: 45
  early_min_progress_pct: 0.05

  # Adaptive chop tightener: shorten the EARLY gate after the day shows clear chop
  # signs (multiple stalled trades). Self-resets each session along with day counters.
  # Main gate is intentionally NOT tightened — it protects slow-developing winners
  # (e.g., 2026-05-05 PETRONET reached TP-territory at 127min on the 90/20% main gate).
  #
  # Trigger: count of no-progress firings today (across early + main gates) reaches
  # `chop_tightener_trigger_count`. From that point, early gate uses the tightened
  # `chop_tightener_early_check_after_minutes` instead of `early_check_after_minutes`.
  #
  # Empirical justification (Apr 20–May 5):
  #   - 4/10 days had ≥2 no-progress exits (Apr 22, 24, 30, May 4, May 5)
  #   - On 2026-05-05, 7/8 filled positions hit no-progress; first 2 fired at 10:45/10:50.
  #     A tightened 30-min gate would have force-exited 4 in-flight stalled trades
  #     ~15 min earlier and freed capital sooner. Main gate would still have caught
  #     PETRONET's eventual recovery.
  #
  # Conservative defaults: trigger=2 (avoids 1-trade noise), tightened=30min.
  # 2026-05-07: disabled. Tightener only shortens the early gate, which is now off.
  chop_tightener_enabled: false
  chop_tightener_trigger_count: 2
  chop_tightener_early_check_after_minutes: 30

  # Loss-cut gate: exit immediately when progress is deeply negative (price running hard
  # against the position), regardless of age — subject to loss_cut_min_age_minutes.
  # At 1:1 R:R, progress=-1.0 ≈ at-SL from fill. -0.80 = 80% of the way to SL.
  # Today's example: BHEL -121% at 90min (would have fired much earlier at -80%).
  # Set min_age_minutes to skip opening-candle noise (20 min recommended).
  loss_cut_enabled: true
  loss_cut_min_age_minutes: 20        # don't fire in first N min after entry
  loss_cut_progress_threshold: -0.80  # fire when progress < -80% (deep loss, heading to SL)

  # Use actual broker fill_price (not signal entry) when computing progress.
  # Recommended true — keeps the metric aligned with what the trade actually risks.
  # Set false to revert to legacy signal-entry-based progress (less accurate).
  use_fill_price_for_progress: true

# ── Position Tracking ────────────────────────────────────
tracking:
  # [tune] Seconds between position checks. Detects broker SL-M fills (qty drops to 0).
  # 5s halves slot-recovery latency vs 10s — 1 API call per poll, negligible load.
  poll_interval: 5

  # [tune] Minimum age (seconds) before a position can be detected as closed.
  # Protects against ghost-closes: when an order is rejected/slow-to-fill, the position
  # briefly shows qty=0 in positionbook before the broker processes the fill.
  # 30s covers the worst-case positionbook propagation lag while still catching real SL hits.
  min_position_age_seconds: 30
  guard2_timeout_minutes: 30     # Max wait for ambiguous entry-order status before assuming complete

# ── Broker / Exchange ────────────────────────────────────
broker:
  # CRITICAL: must match your broker account setup. Changing exchange affects margin estimation.
  exchange: NSE
  product: MIS                   # MIS (intraday, 5x leverage) or CNC (delivery, 1x)
  order_type: MARKET             # MARKET (recommended) or LIMIT — affects slippage_factor calibration

  # [tune] Testing only: place CNC orders in analyze mode outside market hours.
  # Bypasses sandbox MIS restriction without touching live capital. Keep false in production.
  allow_off_hours_testing: false

  # CRITICAL: must match your broker's actual NSE equity MIS margin percentage.
  # Flattrade = 20% (5x leverage). Used to estimate whether full-risk qty fits in live capital.
  # If wrong, margin floor check will either reject valid trades or allow broker rejections.
  mis_margin_pct: 0.20

# ── Broker Restrictions ──────────────────────────────────
# [tune] Symbols the broker is known to reject for a given product, regardless of capital.
# The engine skips these before placing the order — saves a wasted slot, a rejected order
# in the broker book, and the back-and-forth Telegram noise.
#
# Categories (NSE/BSE equity MIS):
#   • T2T (BE series)        — handled separately via _is_be_series() symtoken lookup
#   • GSM Stage 1+           — Graded Surveillance Measure, MIS not allowed
#   • ASM Stage IV+          — Additional Surveillance Measure, no leverage
#   • Stock-specific overrides — broker won't offer MIS leverage on these even outside surveillance
#
# Maintenance: append a symbol here when "Order Rejected: <reason>" appears in the engine
# log for that symbol consistently across days. See FLATTRADE-RESTRICTIONS.md for the
# full procedure and current categorisation.
broker_restrictions:
  flattrade:
    # Stocks Flattrade rejects for MIS regardless of capital. UPPERCASE only.
    mis_rejected: []

# ── Listener ─────────────────────────────────────────────
listener:
  # [tune] Telegram reconnection settings. Increase max_retries for unreliable connections.
  max_retries: 5                 # Max reconnection attempts before giving up
  base_backoff: 2                # Base seconds for exponential backoff between retries

# ── API ──────────────────────────────────────────────────
api:
  # [tune] HTTP timeout and retry settings for OpenAlgo API calls.
  timeout: 5.0                   # Request timeout in seconds
  margin_retries: 3              # Retries for Margin API on network error (not on app errors)

# ── Bracket Orders ────────────────────────────────────────
bracket:
  # CRITICAL: disabling removes all broker-side SL protection. Keep enabled=true in production.
  enabled: true

  # CRITICAL: CNC SL-M orders are cancelled at EOD by NSE — no overnight protection.
  # GTT not supported by OpenAlgo. CNC exits are driven by TradingView EXIT signals only.
  cnc_sl_enabled: false

  # CRITICAL: SL-M (market) is safer than SL (limit) — always fills on gap-down.
  # Only change to SL if your broker doesn't support SL-M.
  sl_order_type: SL-M

  # [tune] SL placement retry settings. Safety-critical — 5 retries × 0.5s = 2.5s window.
  max_sl_retries: 5
  retry_delay: 0.5               # Seconds between SL placement retries

  # [tune] Retry count for TP market exit orders. 3 retries covers brief network glitches.
  tp_exit_retries: 3

  # [tune] Buffer below TP1 for runner SL after partial exit, as fraction of R (0.3 = 30% of R).
  # Prevents stop-out from TP1 wick-backs before price continues to TP1.5.
  # At avg SL=0.64%: ₹150 stock = 6 ticks, ₹500 stock = 18 ticks, ₹800 stock = 30 ticks.
  # 0.3R rationale: TP1 is at ~0.65R; buffer places SL at ~0.35R above entry (still profitable
  # if stopped). TP1.5 is 0.85R further up — gives price room to test TP1 before continuing.
  # 0.1 was too tight (TMPV 2026-04-13: ₹0.80 gap triggered by normal TP1 wick).
  # Set to 0.0 to place SL exactly at TP1.
  tp1_runner_sl_buffer: 0.3

# ── Strategy Profiles ───────────────────────────────────────
# [tune] Per-strategy TP exit fractions and product type.
# tp_levels: TP label -> fraction of position to exit at that level (e.g. TP1: 0.5 = exit 50%).
# product: overrides broker.product for this strategy (MIS or CNC).
# If a strategy is absent here, every TP HIT exits 100% of position.
strategy_profiles:
  ORB:
    product: MIS
    # tp_levels absent — ORB PineScript sends ExitQtyPct in each TP HIT alert.
    # Engine reads ExitQtyPct directly; strategy owns exit fractions, not this config.
  RSI-TP-MR:
    product: MIS
    tp_levels:
      TP1: 1.0                   # Exit 100% at TP1 (single TP for RSI mean reversion)
