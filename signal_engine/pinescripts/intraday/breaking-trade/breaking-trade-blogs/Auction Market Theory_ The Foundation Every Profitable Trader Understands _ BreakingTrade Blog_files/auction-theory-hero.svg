<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bgGlow"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="350" ry="200" fill="#818CF8" opacity="0.05" filter="url(#bgGlow)"/>
  <!-- Buyers side -->
  <g transform="translate(100, 120)">
    <text x="150" y="0" fill="#22D3EE" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle">BUYERS</text>
    <!-- Buyer figures -->
    <g filter="url(#glow)">
      <circle cx="60" cy="60" r="14" fill="#22D3EE" opacity="0.6"/><rect x="48" y="80" width="24" height="35" rx="6" fill="#22D3EE" opacity="0.4"/>
      <circle cx="120" cy="50" r="16" fill="#22D3EE" opacity="0.7"/><rect x="106" y="72" width="28" height="40" rx="6" fill="#22D3EE" opacity="0.5"/>
      <circle cx="180" cy="65" r="13" fill="#22D3EE" opacity="0.5"/><rect x="169" y="84" width="22" height="32" rx="6" fill="#22D3EE" opacity="0.35"/>
      <circle cx="240" cy="55" r="15" fill="#22D3EE" opacity="0.65"/><rect x="227" y="76" width="26" height="36" rx="6" fill="#22D3EE" opacity="0.45"/>
    </g>
    <!-- Bid arrows pointing right -->
    <g stroke="#22D3EE" stroke-width="2" opacity="0.5">
      <line x1="80" y1="150" x2="200" y2="200"/><polygon points="195,195 205,200 195,205" fill="#22D3EE" opacity="0.5"/>
      <line x1="100" y1="170" x2="220" y2="220"/><polygon points="215,215 225,220 215,225" fill="#22D3EE" opacity="0.5"/>
      <line x1="70" y1="190" x2="190" y2="240"/><polygon points="185,235 195,240 185,245" fill="#22D3EE" opacity="0.5"/>
    </g>
    <text x="150" y="310" fill="#22D3EE" font-family="system-ui" font-size="14" text-anchor="middle" opacity="0.6">Bidding UP</text>
  </g>
  <!-- Center: Price Discovery -->
  <g transform="translate(460, 80)">
    <rect width="280" height="470" rx="20" fill="#1e293b" opacity="0.5" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="140" y="35" fill="#f1f5f9" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">FAIR VALUE</text>
    <!-- Price levels with acceptance/rejection -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="240" height="22" rx="4" fill="#f87171" opacity="0.15"/><text x="125" y="16" fill="#f87171" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.5">Too High — Rejected</text>
      <rect x="0" y="30" width="240" height="22" rx="4" fill="#f87171" opacity="0.1"/>
      <rect x="0" y="60" width="240" height="22" rx="4" fill="#f59e0b" opacity="0.1"/>
      <rect x="0" y="90" width="240" height="22" rx="4" fill="#818CF8" opacity="0.15"/>
      <rect x="0" y="120" width="240" height="22" rx="4" fill="#818CF8" opacity="0.25"/>
      <rect x="0" y="150" width="240" height="22" rx="4" fill="#22D3EE" opacity="0.4"/><text x="125" y="166" fill="#22D3EE" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.8">Fair Value ✓</text>
      <rect x="0" y="180" width="240" height="22" rx="4" fill="#22D3EE" opacity="0.5"/>
      <rect x="0" y="210" width="240" height="22" rx="4" fill="#22D3EE" opacity="0.4"/>
      <rect x="0" y="240" width="240" height="22" rx="4" fill="#818CF8" opacity="0.25"/>
      <rect x="0" y="270" width="240" height="22" rx="4" fill="#818CF8" opacity="0.15"/>
      <rect x="0" y="300" width="240" height="22" rx="4" fill="#f59e0b" opacity="0.1"/>
      <rect x="0" y="330" width="240" height="22" rx="4" fill="#f87171" opacity="0.1"/>
      <rect x="0" y="360" width="240" height="22" rx="4" fill="#f87171" opacity="0.15"/><text x="125" y="376" fill="#f87171" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.5">Too Low — Rejected</text>
    </g>
    <!-- Bouncing price ball -->
    <circle cx="140" cy="220" r="10" fill="#818CF8" filter="url(#glow)">
      <animate attributeName="cy" values="120;160;180;210;220;210;180;160;120;100;120" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Sellers side -->
  <g transform="translate(820, 120)">
    <text x="150" y="0" fill="#f87171" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle">SELLERS</text>
    <!-- Seller figures -->
    <g filter="url(#glow)">
      <circle cx="60" cy="60" r="14" fill="#f87171" opacity="0.6"/><rect x="48" y="80" width="24" height="35" rx="6" fill="#f87171" opacity="0.4"/>
      <circle cx="120" cy="50" r="16" fill="#f87171" opacity="0.7"/><rect x="106" y="72" width="28" height="40" rx="6" fill="#f87171" opacity="0.5"/>
      <circle cx="180" cy="65" r="13" fill="#f87171" opacity="0.5"/><rect x="169" y="84" width="22" height="32" rx="6" fill="#f87171" opacity="0.35"/>
      <circle cx="240" cy="55" r="15" fill="#f87171" opacity="0.65"/><rect x="227" y="76" width="26" height="36" rx="6" fill="#f87171" opacity="0.45"/>
    </g>
    <!-- Ask arrows pointing left -->
    <g stroke="#f87171" stroke-width="2" opacity="0.5">
      <line x1="220" y1="150" x2="100" y2="200"/><polygon points="105,195 95,200 105,205" fill="#f87171" opacity="0.5"/>
      <line x1="200" y1="170" x2="80" y2="220"/><polygon points="85,215 75,220 85,225" fill="#f87171" opacity="0.5"/>
      <line x1="230" y1="190" x2="110" y2="240"/><polygon points="115,235 105,240 115,245" fill="#f87171" opacity="0.5"/>
    </g>
    <text x="150" y="310" fill="#f87171" font-family="system-ui" font-size="14" text-anchor="middle" opacity="0.6">Offering DOWN</text>
  </g>
  <!-- Bottom insight -->
  <rect x="250" y="570" width="700" height="40" rx="10" fill="#1e293b" opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="600" y="595" fill="#94a3b8" font-family="system-ui" font-size="13" text-anchor="middle">The market is an auction — price probes until buyers and sellers agree on value</text>
</svg>
