<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="bullGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bgGlow"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="#818CF8" opacity="0.05" filter="url(#bgGlow)"/>
  <!-- Bull silhouette made of TPO blocks -->
  <g transform="translate(150, 100)" filter="url(#glow)">
    <!-- Bull body (profile blocks) -->
    <rect x="200" y="200" width="30" height="14" rx="2" fill="#818CF8" opacity="0.5"/>
    <rect x="200" y="218" width="60" height="14" rx="2" fill="#818CF8" opacity="0.6"/>
    <rect x="200" y="236" width="100" height="14" rx="2" fill="#818CF8" opacity="0.7"/>
    <rect x="200" y="254" width="160" height="14" rx="2" fill="#6366f1" opacity="0.8"/>
    <rect x="200" y="272" width="220" height="14" rx="2" fill="#22D3EE" opacity="0.85"/>
    <rect x="200" y="290" width="260" height="14" rx="2" fill="#22D3EE" opacity="0.95"/>
    <rect x="200" y="308" width="220" height="14" rx="2" fill="#22D3EE" opacity="0.85"/>
    <rect x="200" y="326" width="160" height="14" rx="2" fill="#6366f1" opacity="0.8"/>
    <rect x="200" y="344" width="100" height="14" rx="2" fill="#818CF8" opacity="0.7"/>
    <rect x="200" y="362" width="60" height="14" rx="2" fill="#818CF8" opacity="0.6"/>
    <rect x="200" y="380" width="30" height="14" rx="2" fill="#818CF8" opacity="0.5"/>
    <!-- Bull horns -->
    <path d="M200,200 Q180,140 140,100 Q130,90 135,95" fill="none" stroke="url(#bullGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M240,200 Q260,140 300,100 Q310,90 305,95" fill="none" stroke="url(#bullGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Bull head -->
    <circle cx="220" cy="180" r="25" fill="#818CF8" opacity="0.2"/>
    <circle cx="210" cy="175" r="3" fill="#f1f5f9" opacity="0.6"/>
    <circle cx="230" cy="175" r="3" fill="#f1f5f9" opacity="0.6"/>
  </g>
  <!-- Right panel: NIFTY data -->
  <g transform="translate(700, 100)">
    <rect width="400" height="430" rx="16" fill="#1e293b" opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="200" y="40" fill="#f1f5f9" font-family="system-ui" font-size="20" font-weight="800" text-anchor="middle">NIFTY 50</text>
    <text x="200" y="65" fill="#22D3EE" font-family="monospace" font-size="24" font-weight="700" text-anchor="middle">22,450.30</text>
    <text x="200" y="85" fill="#38ef7d" font-family="system-ui" font-size="13" text-anchor="middle">▲ +0.82%</text>
    <line x1="30" y1="100" x2="370" y2="100" stroke="#334155" stroke-width="1"/>
    <!-- Key levels -->
    <g font-family="system-ui" font-size="13">
      <text x="30" y="135" fill="#94a3b8">POC</text><text x="370" y="135" fill="#22D3EE" text-anchor="end" font-family="monospace">22,420</text>
      <text x="30" y="165" fill="#94a3b8">VAH</text><text x="370" y="165" fill="#818CF8" text-anchor="end" font-family="monospace">22,510</text>
      <text x="30" y="195" fill="#94a3b8">VAL</text><text x="370" y="195" fill="#818CF8" text-anchor="end" font-family="monospace">22,380</text>
      <text x="30" y="225" fill="#94a3b8">IB High</text><text x="370" y="225" fill="#f59e0b" text-anchor="end" font-family="monospace">22,485</text>
      <text x="30" y="255" fill="#94a3b8">IB Low</text><text x="370" y="255" fill="#f59e0b" text-anchor="end" font-family="monospace">22,395</text>
    </g>
    <line x1="30" y1="275" x2="370" y2="275" stroke="#334155" stroke-width="1"/>
    <!-- Session info -->
    <text x="200" y="310" fill="#f1f5f9" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">NSE Session</text>
    <g font-family="system-ui" font-size="11" fill="#94a3b8">
      <text x="30" y="340">Pre-Open</text><text x="370" y="340" fill="#64748b" text-anchor="end">9:00 – 9:15</text>
      <text x="30" y="365">IB Formation</text><text x="370" y="365" fill="#f59e0b" text-anchor="end">9:15 – 10:15</text>
      <text x="30" y="390">Regular Session</text><text x="370" y="390" fill="#818CF8" text-anchor="end">10:15 – 3:00</text>
      <text x="30" y="415">Closing</text><text x="370" y="415" fill="#64748b" text-anchor="end">3:00 – 3:30</text>
    </g>
  </g>
  <!-- Data streams -->
  <g opacity="0.2">
    <circle cx="650" cy="200" r="2" fill="#22D3EE"><animate attributeName="cx" values="650;700" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="1.5" fill="#818CF8"><animate attributeName="cx" values="640;700" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="400" r="2" fill="#22D3EE"><animate attributeName="cx" values="660;700" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
